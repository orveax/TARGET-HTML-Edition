name: PG08 Parent Navigation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg08-parent-nav-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve Capabilities parent active state on PG08
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/origex-ui.js')
          s=p.read_text(encoding='utf-8')
          marker='const hydrateCompanyNavigation = () => {'
          head,tail=s.split(marker,1)
          old="""    const currentFile = window.location.pathname.split('/').pop() || 'index.html';
    const companyFiles = new Set(['about.html', 'how-we-work.html', 'capabilities.html']);"""
          new="""    const currentFile = window.location.pathname.split('/').pop() || 'index.html';
    const activeCompanyFile = currentFile === 'service-details.html' ? 'capabilities.html' : currentFile;
    const companyFiles = new Set(['about.html', 'how-we-work.html', 'capabilities.html']);"""
          if old not in tail:
              raise SystemExit('company navigation context not found')
          tail=tail.replace(old,new,1)
          old_active="if (href === currentFile) link.setAttribute('aria-current', 'page');"
          if tail.count(old_active) < 2:
              raise SystemExit('expected company active-state comparisons not found')
          tail=tail.replace(old_active,"if (href === activeCompanyFile) link.setAttribute('aria-current', 'page');",2)
          p.write_text(head+marker+tail,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/origex-ui.js
          git commit -m 'PG08 preserve Capabilities parent navigation state'
          git pull --rebase origin main
          git push origin HEAD:main
