name: PG12 Align Implementation Tracker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg12-align-tracker.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align PG12 status and tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Last Updated: 2026-08-19 — GLOBAL NAV V1 LOCKED / V1 = 33 LAYOUTS / PG09–PG11 PS7 CI QA PASS / PG12 NEXT','Last Updated: 2026-08-19 — GLOBAL NAV V1 LOCKED / V1 = 33 LAYOUTS / PG09–PG12 PS7 CI QA PASS / PG13 NEXT')
          s=s.replace('| PG11 Product Details | PS7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED 8/8 + PRODUCT SWITCH + SUPPLIER RELATION + RESOURCE PLACEHOLDERS + RELATED PRODUCTS + RFQ + PRODUCT-NAVIGATION QA PASS |','| PG11 Product Details | PS7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED 8/8 + PRODUCT SWITCH + SUPPLIER RELATION + RESOURCE PLACEHOLDERS + RELATED PRODUCTS + RFQ + PRODUCT-NAVIGATION QA PASS |\n| PG12 Suppliers / Brands Directory | PS7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED 8/8 + SEARCH/CATEGORY/ORIGIN FILTER + FEATURED + QUERY-PARAM + SUPPLIER-NAVIGATION QA PASS |')
          s=s.replace('M4 IN PROGRESS — PG09–PG11 PS7 CI PASS; PG12 Suppliers / Brands Directory next.','M4 IN PROGRESS — PG09–PG12 PS7 CI PASS; PG13 Supplier / Brand Details next.')
          s=s.replace('| M4 Product / Supplier / Conversion | IN PROGRESS | PG09–PG11 PS7 CI PASS; PG12–PG13 + PG16–PG19 remain |','| M4 Product / Supplier / Conversion | IN PROGRESS | PG09–PG12 PS7 CI PASS; PG13 + PG16–PG19 remain |')
          s=s.replace('├── product-details.html           # PG11 — PS7 CI PASS\n└── company-profile.html', '├── product-details.html           # PG11 — PS7 CI PASS\n├── suppliers.html                 # PG12 — PS7 CI PASS\n└── company-profile.html')
          s=s.replace('│   ├── origex-product-details.css\n│   ├── origex-company-profile.css', '│   ├── origex-product-details.css\n│   ├── origex-suppliers.css\n│   ├── origex-company-profile.css')
          s=s.replace('│   ├── origex-product-details.js\n│   └── origex-landing.js', '│   ├── origex-product-details.js\n│   ├── origex-suppliers.js\n│   └── origex-landing.js')
          s=s.replace('├── pg11-product-details/\n└── pg33-company-profile/', '├── pg11-product-details/\n├── pg12-suppliers/\n└── pg33-company-profile/')
          s=s.replace('│   ├── pg11-product-details-v1.md\n│   └── pg33-company-profile-v1.md', '│   ├── pg11-product-details-v1.md\n│   ├── pg12-suppliers-v1.md\n│   └── pg33-company-profile-v1.md')
          s=s.replace('| PG12 | Suppliers / Brands Directory | PS0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PG12 | Suppliers / Brands Directory | PS7 — IMPLEMENTED | APPROVED — `pg12-suppliers-v1.md` | `ar/suppliers.html` + `en/suppliers.html` | DATA + SOURCE + RENDERED 8/8 + SEARCH/CATEGORY/ORIGIN FILTER + FEATURED + QUERY-PARAM + SUPPLIER-NAVIGATION QA PASS — CLOUDFLARE M4 BATCH REVIEW PENDING |')
          s=s.replace('- Current: PS7 pending Cloudflare M4 batch browser review. PG12 Suppliers / Brands Directory is next.','- Current: PS7 pending Cloudflare M4 batch browser review. PG12 is also PS7; PG13 Supplier / Brand Details is next.')
          marker='## Cloudflare Test Environment Control'
          evidence='''## M4 PG12 Evidence\n\n### PG12 — Suppliers / Brands Directory\n- PS6 contract: `docs/page-design-profiles/pg12-suppliers-v1.md`.\n- AR/EN: `ar/suppliers.html` + `en/suppliers.html`.\n- Composition/runtime: `assets/css/origex-suppliers.css` + `assets/js/origex-suppliers.js`.\n- Data authority: `assets/data/suppliers.json` + `assets/data/products.json`; 4 fictional suppliers / 12 linked products / 4 featured demo records.\n- Frozen scope: search, category filter, origin filter, supplier/brand cards, featured suppliers and commercial CTA.\n- Source/data QA: `qa/pg12-suppliers/source-report.json` — failures 0.\n- Rendered/interaction QA: `qa/pg12-suppliers/rendered-report.json` — failures 0; AR/EN × 390/820/1366/1536 = 8/8 PASS; search/category/origin/reset/empty, Arabic deep-link hydration and desktop/mobile Supplier navigation PASS.\n- QA investigation found a Selenium state-event edge case after `clear()`; runtime filter state was hardened in commit `15e7c2efe2344f2324e12e68d4cd8cec6b48647b`, and comprehensive rendered diagnostic commit `88827601664524f1111229d7cce5bd876b72e5b5` passed with zero failures / no exception. Diagnostic artifacts/workflow were then removed.\n- Final QA: `qa/pg12-suppliers/run-status.txt` = PASS.\n- Current: PS7 pending Cloudflare M4 batch browser review. PG13 Supplier / Brand Details is next.\n\n'''
          if '## M4 PG12 Evidence' not in s:
              s=s.replace(marker,evidence+marker)
          s=s.replace('4. Open M4 page production after the M3 batch deployment gate.','4. Continue M4 page production with PG13 Supplier / Brand Details; M3 Cloudflare review remains a parallel PS8 gate.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit aligned tracker and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pg12-align-tracker.yml
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git commit -m "docs: align tracker with PG12 PS7 closure"
          git push origin main
