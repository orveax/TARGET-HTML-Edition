name: PG10 Align Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg10-align-tracker.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align implementation tracker after PG10 QA pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('Last Updated: 2026-08-19 — M4 IN PROGRESS / PG09 C7 CI QA PASS / M3 CODE+CI COMPLETE','Last Updated: 2026-08-19 — M4 IN PROGRESS / PG09–PG10 C7 CI QA PASS / PG11 NEXT'),
            ('| PG09 Product Categories | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + PRODUCT-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |','| PG09 Product Categories | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + PRODUCT-NAVIGATION QA PASS |\n| PG10 Products Grid | C7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED + SEARCH/FILTER/PAGINATION + PRODUCT-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |'),
            ('| M3 Shared Navigation IA | ACTIVE — Home + Company + Market families exposed centrally in shared navigation |','| Shared Navigation IA | ACTIVE — Home + Product + Company + Market families exposed centrally in shared navigation |'),
            ('| Current Build Baseline | M4 IN PROGRESS — PG09 C7 CI PASS; PG10 next. M2/M3 Cloudflare closure remains open in parallel |','| Current Build Baseline | M4 IN PROGRESS — PG09–PG10 C7 CI PASS; PG11 next. M2/M3 Cloudflare closure remains open in parallel |'),
            ('| M4 Product / Supplier / Conversion | IN PROGRESS | PG09 C7 CI PASS; PG10–PG13 + PG16–PG19 remain |','| M4 Product / Supplier / Conversion | IN PROGRESS | PG09–PG10 C7 CI PASS; PG11–PG13 + PG16–PG19 remain |'),
            ('└── product-categories.html        # PG09 — C7 CI PASS','├── product-categories.html        # PG09 — C7 CI PASS\n└── products.html                  # PG10 — C7 CI PASS'),
            ('└── product-categories.html        # PG09 — C7 CI PASS','├── product-categories.html        # PG09 — C7 CI PASS\n└── products.html                  # PG10 — C7 CI PASS'),
            ('│   ├── origex-product-categories.css\n│   └── origex-shell.css','│   ├── origex-product-categories.css\n│   ├── origex-products.css\n│   └── origex-shell.css'),
            ('│   ├── origex-product-categories.js\n│   └── origex-landing.js','│   ├── origex-product-categories.js\n│   ├── origex-products.js\n│   └── origex-landing.js'),
            ('├── patterns/\n└── vendor/bootstrap/','├── data/\n│   ├── products.json\n│   └── suppliers.json\n├── patterns/\n└── vendor/bootstrap/'),
            ('├── pg15-markets/\n└── pg09-product-categories/','├── pg15-markets/\n├── pg09-product-categories/\n└── pg10-products/'),
            ('│   ├── pg15-markets-v1.md\n│   └── pg09-product-categories-v1.md','│   ├── pg15-markets-v1.md\n│   ├── pg09-product-categories-v1.md\n│   └── pg10-products-grid-v1.md'),
            ('| PG10 | Products Grid | C0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PG10 | Products Grid | C7 — IMPLEMENTED | APPROVED — `pg10-products-grid-v1.md` | `ar/products.html` + `en/products.html` | DATA + SOURCE + RENDERED 8/8 + SEARCH/FILTER/PAGINATION + PRODUCT-NAVIGATION QA PASS — CLOUDFLARE M4 BATCH REVIEW PENDING |')
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('missing tracker text: '+old[:110])
            s=s.replace(old,new,1)
          marker='## Cloudflare Test Environment Control'
          section='''## M4 PG10 Evidence\n\n### PG10 — Products Grid\n- Profile: `docs/page-design-profiles/pg10-products-grid-v1.md`.\n- AR/EN: `ar/products.html` + `en/products.html`.\n- Canonical data: `assets/data/products.json` (12 fictional demo products) + `assets/data/suppliers.json` (4 fictional demo suppliers).\n- Composition: `assets/css/origex-products.css`.\n- Runtime: `assets/js/origex-products.js`.\n- Frozen scope: search, category filter, brand filter, origin filter, product cards, pagination, RFQ CTA.\n- All demo availability values use the frozen `on-request` vocabulary; no fake prices, stock quantities, ratings or commercial rights.\n- Source/data QA: `qa/pg10-products/source-report.json` — failures 0; schema, relations, assets, SEO and AR/EN contracts PASS.\n- Final rendered/interaction QA authority: `qa/pg10-products/rendered-report-v2.json` — failures 0; AR/EN × 390/820/1366/1536 = 8/8 PASS.\n- Search + category/brand/origin filters + reset + pagination + empty state + `?category=frozen` deep-link + Product Details/RFQ routes + desktop/mobile Product navigation PASS.\n- Earlier rendered report false-failed lazy-loaded images in headless Chrome before viewport exposure; source QA proved all image paths exist. The corrected rendered gate supersedes that QA-tool defect.\n- Final status: `qa/pg10-products/run-status.txt` = PASS.\n- Current: C7 pending Cloudflare M4 batch browser review. PG11 Product Details is next.\n\n'''
          if '### PG10 — Products Grid' not in s:
            if marker not in s: raise SystemExit('Cloudflare marker missing')
            s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git rm .github/workflows/pg10-align-tracker.yml
          git commit -m 'M4 align tracker after PG10 CI QA pass'
          git pull --rebase origin main
          git push origin HEAD:main
