name: PG02 Visual Review Snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.pg02-review-trigger'
      - 'ar/home-02.html'
      - 'en/home-02.html'
      - 'assets/css/origex-distribution.css'
      - 'assets/media/demo/hero-distribution-network.svg'
      - '.github/workflows/pg02-visual-review-snapshots.yml'

permissions:
  contents: write

concurrency:
  group: pg02-visual-review-main
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start site and ChromeDriver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/origex-http.log 2>&1 &
          chromedriver --port=9515 --allowed-origins='*' >/tmp/origex-chromedriver.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/en/home-02.html >/dev/null
      - name: Capture visual review images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg02-visual-review
          python3 - <<'PY'
          import base64,json,time,urllib.request
          from pathlib import Path
          WD='http://127.0.0.1:9515';OUT=Path('qa/pg02-visual-review')
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();r=urllib.request.Request(WD+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=30) as f:body=json.loads(f.read().decode())
            value=body.get('value')
            if isinstance(value,dict) and value.get('error'):raise RuntimeError(value)
            return value
          def session(w,h):
            v=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1',f'--window-size={w},{h}']}}}});sid=v['sessionId'];req('POST',f'/session/{sid}/window/rect',{'width':w,'height':h,'x':0,'y':0});return sid
          def cdp(sid,cmd,params=None):return req('POST',f'/session/{sid}/goog/cdp/execute',{'cmd':cmd,'params':params or {}})
          cases=[('ar','/ar/home-02.html',390,844,.50,.78),('en','/en/home-02.html',390,844,.50,.78),('ar','/ar/home-02.html',1536,960,.23,.42),('en','/en/home-02.html',1536,960,.23,.42)]
          rows=[]
          for lang,path,w,h,full_scale,hero_scale in cases:
            sid=session(w,h)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.9)
              layout=cdp(sid,'Page.getLayoutMetrics');size=layout.get('cssContentSize') or layout.get('contentSize');label=f'{lang}-{w}'
              full=cdp(sid,'Page.captureScreenshot',{'format':'jpeg','quality':12,'fromSurface':True,'captureBeyondViewport':True,'clip':{'x':0,'y':0,'width':size['width'],'height':size['height'],'scale':full_scale}});fp=OUT/f'{label}-full-review.jpeg';fp.write_bytes(base64.b64decode(full['data']))
              hero=cdp(sid,'Page.captureScreenshot',{'format':'jpeg','quality':18,'fromSurface':True,'captureBeyondViewport':False,'clip':{'x':0,'y':0,'width':w,'height':h,'scale':hero_scale}});hp=OUT/f'{label}-hero-review.jpeg';hp.write_bytes(base64.b64decode(hero['data']))
              rows.append({'case':label,'full':str(fp),'hero':str(hp),'fullBytes':fp.stat().st_size,'heroBytes':hp.stat().st_size})
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
          (OUT/'manifest.json').write_text(json.dumps({'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'cases':rows},indent=2),encoding='utf-8')
          PY
      - name: Commit visual evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orveax-build'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/pg02-visual-review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG02 add compact visual review snapshots'
          git push origin main
