name: PG28 404 QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'opf/pg28-*'
    paths:
      - 'ar/404.html'
      - 'en/404.html'
      - 'assets/css/origex-404.css'
      - 'assets/js/origex-404.js'
      - 'assets/js/config.js'
      - 'assets/js/config-engine.js'
      - 'assets/js/origex-ui.js'
      - 'assets/icons/sprite.svg'
      - 'docs/page-design-profiles/pg28-404-v1.md'
      - '.github/scripts/qa_pg28_404.py'
      - '.github/scripts/qa_pg28_404_v2.py'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg28-404-qa.yml'

concurrency:
  group: pg28-404-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG28 source SEO recovery rendered interaction QA V2
        run: python .github/scripts/qa_pg28_404_v2.py
      - name: Commit PG28 QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg28-404 || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG28 record 404 QA evidence"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
          exit 1
