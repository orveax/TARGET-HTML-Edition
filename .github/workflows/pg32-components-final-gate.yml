name: PG32 Components Final Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg32-components-final-gate.yml'

concurrency:
  group: pg32-components-final-gate-self-report
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QA dependencies
        run: python -m pip install --quiet beautifulsoup4 selenium
      - id: pg32
        name: Run stabilized PG32 V3 gate
        continue-on-error: true
        run: python .github/scripts/qa_pg32_components_v3.py
      - name: Record and commit isolated PG32 final evidence
        if: always()
        env:
          PG32_OUTCOME: ${{ steps.pg32.outcome }}
        run: |
          mkdir -p qa/pg32-components
          printf 'source=%s\noutcome=%s\n' "$GITHUB_SHA" "$PG32_OUTCOME" > qa/pg32-components/final-gate-execution.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg32-components
          git commit -m "PG32 record self-reported final gate evidence"
          git pull --rebase origin main || true
          git push origin main || true
      - name: Enforce PG32 gate outcome
        if: steps.pg32.outcome == 'failure'
        run: exit 1
