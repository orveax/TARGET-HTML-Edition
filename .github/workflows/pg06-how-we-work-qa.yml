name: PG06 How We Work QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/how-we-work.html'
      - 'en/how-we-work.html'
      - 'assets/css/origex-how-we-work.css'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg06-how-we-work-v1.md'
      - '.github/workflows/pg06-how-we-work-qa.yml'

permissions:
  contents: write

concurrency:
  group: pg06-how-we-work-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Source content SEO asset and icon QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg06-how-we-work
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,time,sys

          pages={
            'ar/how-we-work.html':{'lang':'ar','dir':'rtl','h1':'من المعلومة إلى القرار، ثم إلى خطوة تجارية مناسبة.','canonical':'https://example.com/ar/how-we-work.html','disclosure':'جميع الأسماء والبيانات التجارية الواردة في العرض التوضيحي أمثلة خيالية لأغراض القالب، ويجب استبدالها ببيانات فعلية قبل النشر.'},
            'en/how-we-work.html':{'lang':'en','dir':'ltr','h1':'From information to a decision, then to the right commercial next step.','canonical':'https://example.com/en/how-we-work.html','disclosure':'All names and commercial data in this demo are fictional template examples and must be replaced with verified business information before publication.'},
          }
          sprite=Path('assets/icons/sprite.svg').read_text(encoding='utf-8')
          sprite_ids=set(re.findall(r'<symbol id="([^"]+)"',sprite))
          forbidden=['targetft','target.targetft','cdn.jsdelivr','unpkg.com','cdnjs.cloudflare','fonts.googleapis.com','fonts.gstatic.com']
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.html={};self.h1=[];self.buf=[];self.in_h1=False;self.assets=[];self.ids=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='html':self.html=d
              if d.get('id'):self.ids.append(d['id'])
              if t=='h1':self.in_h1=True;self.buf=[]
              if t in ('link','script','img'):
                k='href' if t=='link' else 'src'
                if d.get(k):self.assets.append(d[k])
            def handle_data(self,d):
              if self.in_h1:self.buf.append(d)
            def handle_endtag(self,t):
              if t=='h1':self.in_h1=False;self.h1.append(''.join(self.buf).strip())
          errors=[];results=[]
          for rel,s in pages.items():
            text=Path(rel).read_text(encoding='utf-8');p=P();p.feed(text);checks={}
            checks['languageDirection']=p.html.get('lang')==s['lang'] and p.html.get('dir')==s['dir']
            checks['singleH1']=len(p.h1)==1 and p.h1[0]==s['h1']
            checks['canonical']=f'rel="canonical" href="{s["canonical"]}"' in text
            checks['hreflang']=all(x in text for x in ('hreflang="ar"','hreflang="en"','hreflang="x-default"'))
            checks['openGraph']=all(x in text for x in ('og:type','og:site_name','og:title','og:description','og:url','og:image'))
            checks['structuredData']='BreadcrumbList' in text and 'WebPage' in text
            checks['demoDisclosure']=s['disclosure'] in text
            checks['sevenFrozenSections']=all(x in text for x in ('orx-how-hero','id="qualification-title"','id="process-title"','id="roles-title"','id="required-title"','id="decision-title"','id="next-title"'))
            checks['fourStepProcess']=text.count('orx-process-step')==4
            checks['responsibilityColumns']=text.count('orx-role-card')==3
            checks['decisionStates']=text.count('orx-decision-card orx-decision-card--')==3
            checks['howCSS']='../assets/css/origex-how-we-work.css' in text
            checks['runtime']=all(x in text for x in ('../assets/js/config.js','../assets/js/config-engine.js','../assets/js/origex-ui.js'))
            checks['uniqueIDs']=len(p.ids)==len(set(p.ids))
            checks['noClientCDNLeakage']=not any(x in text.lower() for x in forbidden) and 'TARGET' not in text
            icon_refs=set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text))
            missing=sorted(icon_refs-sprite_ids);checks['iconReferencesResolve']=not missing
            local=[]
            for a in p.assets:
              if a.startswith(('http://','https://','data:','#')):continue
              clean=a.split('?',1)[0].split('#',1)[0]
              if clean:local.append(((Path(rel).parent/clean).resolve()).exists())
            checks['localAssets']=all(local)
            bad=[k for k,v in checks.items() if not v]
            if bad:errors.append(f'{rel}: {bad}; missing icons={missing}')
            results.append({'page':rel,'checks':checks,'missingIcons':missing,'pass':not bad})
          for req in ('assets/css/origex-how-we-work.css','docs/page-design-profiles/pg06-how-we-work-v1.md'):
            if not Path(req).exists():errors.append('missing '+req)
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          Path('qa/pg06-how-we-work/source-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Start browser QA services
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version | tee qa/pg06-how-we-work/browser-baseline.txt
          chromedriver --version | tee -a qa/pg06-how-we-work/browser-baseline.txt
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/origex-http.log 2>&1 &
          chromedriver --port=9515 --allowed-origins='*' >/tmp/origex-chromedriver.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/ar/how-we-work.html >/dev/null
          curl -fsS http://127.0.0.1:9515/status >/dev/null

      - name: Rendered responsive navigation QA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,sys
          from pathlib import Path
          WD='http://127.0.0.1:9515';OUT=Path('qa/pg06-how-we-work')
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();r=urllib.request.Request(WD+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=30) as f:body=json.loads(f.read().decode())
            return body.get('value') if isinstance(body,dict) else body
          def session(w,h):
            v=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1',f'--window-size={w},{h}']}}}});sid=v['sessionId'];req('POST',f'/session/{sid}/window/rect',{'width':w,'height':h,'x':0,'y':0});return sid
          def js(sid,s,args=None):return req('POST',f'/session/{sid}/execute/sync',{'script':s,'args':args or []})
          pages=[('ar','/ar/how-we-work.html','rtl'),('en','/en/how-we-work.html','ltr')];views=[(390,844),(820,1180),(1366,900),(1536,960)]
          results=[];errors=[]
          metric="""const w=arguments[0],d=arguments[1],doc=document.documentElement;const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!e.closest('[aria-hidden=\"true\"]')};const off=[...document.querySelectorAll('body *')].filter(e=>{if(!vis(e)||getComputedStyle(e).position==='fixed')return false;const r=e.getBoundingClientRect();return r.right>w+1||r.left<-1}).length;const b=[...document.querySelectorAll('.orx-btn')].filter(vis).map(e=>e.getBoundingClientRect().height);return{dir:doc.dir,overflow:doc.scrollWidth>doc.clientWidth+1,off,minButton:b.length?Math.min(...b):0,h1:!!document.querySelector('h1'),steps:document.querySelectorAll('.orx-process-step').length,roles:document.querySelectorAll('.orx-role-card').length,decisions:document.querySelectorAll('.orx-decision-card').length};"""
          for lang,path,dirn in pages:
            for w,h in views:
              sid=session(w,h)
              try:
                req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.45);m=js(sid,metric,[w,dirn]);required=44 if w<=1024 else 40
                checks={'direction':m['dir']==dirn,'noOverflow':not m['overflow'] and m['off']==0,'touchTargets':m['minButton']>=required,'h1':m['h1'],'fourSteps':m['steps']==4,'threeRoles':m['roles']==3,'threeDecisions':m['decisions']==3}
                if not all(checks.values()):errors.append(f'{lang}-{w}: {checks} {m}')
                results.append({'lang':lang,'viewport':w,'checks':checks,'metrics':m,'pass':all(checks.values())})
              finally:
                try:req('DELETE',f'/session/{sid}')
                except:pass
            sid=session(1366,900)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.35)
              nav=js(sid,"""const t=document.querySelector('[data-orx-mega-trigger]');if(!t)return false;t.click();const m=document.getElementById(t.getAttribute('aria-controls'));const links=[...m.querySelectorAll('[data-orx-company-link]')].map(a=>a.getAttribute('href'));const active=m.querySelector('[data-orx-company-link="how-we-work.html"][aria-current="page"]');const ok=t.getAttribute('aria-expanded')==='true'&&!m.hidden&&links.includes('about.html')&&links.includes('how-we-work.html')&&links.includes('capabilities.html')&&!!active;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return ok&&t.getAttribute('aria-expanded')==='false'&&m.hidden;""")
              if not nav:errors.append(f'{lang}: desktop company nav')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
            sid=session(390,844)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.35)
              mobile=js(sid,"""const b=document.querySelector('[data-orx-drawer-open]');if(!b)return false;b.click();const d=document.querySelector('[data-orx-mobile-drawer]');const links=[...d.querySelectorAll('[data-orx-company-link]')].map(a=>a.getAttribute('href'));const active=d.querySelector('[data-orx-company-link="how-we-work.html"][aria-current="page"]');const ok=d.getAttribute('aria-hidden')==='false'&&links.includes('about.html')&&links.includes('how-we-work.html')&&links.includes('capabilities.html')&&!!active;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return ok&&d.getAttribute('aria-hidden')==='true';""")
              if not mobile:errors.append(f'{lang}: mobile company nav')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          (OUT/'rendered-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          (OUT/'run-status.txt').write_text('PASS\n' if not errors else 'FAIL\n')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Record QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/pg06-how-we-work
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG06 record How We Work QA evidence'
          git pull --rebase origin main
          git push origin HEAD:main
