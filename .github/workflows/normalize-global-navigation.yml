name: Normalize Global Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-global-navigation.yml'
      - '.github/scripts/normalize_global_navigation.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize standard page navigation
        run: python .github/scripts/normalize_global_navigation.py
      - name: Commit normalized navigation
        run: |
          if git diff --quiet; then
            echo "No navigation drift to normalize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar en assets/js/origex-ui.js
          git commit -m "fix: unify global navigation across standard pages"
          git push origin main

