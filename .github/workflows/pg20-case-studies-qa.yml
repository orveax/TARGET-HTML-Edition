name: PG20 Case Studies QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/case-studies.html'
      - 'en/case-studies.html'
      - 'assets/css/origex-case-studies.css'
      - 'assets/js/origex-case-studies.js'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-shell.css'
      - 'assets/icons/sprite.svg'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg20-case-studies-v1.md'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg20-case-studies-qa.yml'

concurrency:
  group: pg20-case-studies-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG20 source rendered and interaction QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,subprocess,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          R=Path('.'); O=R/'qa/pg20-case-studies'; O.mkdir(parents=True,exist_ok=True)
          source={'failures':[],'pages':{},'runtime':{}}
          js=(R/'assets/js/origex-case-studies.js').read_text(encoding='utf-8'); rf=[]
          for bad in ('fetch(','XMLHttpRequest','localStorage','sessionStorage','method:"POST"',"method:'POST'"):
            if bad in js: rf.append('forbidden:'+bad)
          for required in ('data-orx-case-filter','history.replaceState','aria-pressed','data-pg20-filter'):
            token=required.replace('data-','').replace('-','') if False else required
          for required in ('history.replaceState','aria-pressed','pg20Filter','pg20Visible'):
            if required not in js: rf.append('missing:'+required)
          source['runtime']={'failures':rf}; source['failures']+=rf

          sprite=(R/'assets/icons/sprite.svg').read_text(encoding='utf-8'); sprite_ids=set(re.findall(r'<symbol[^>]+id="([^"]+)"',sprite))
          specs={
            'ar':('rtl','حالات توضيحية من تحدٍ تجاري إلى خطوة قابلة للتنفيذ.','../en/case-studies.html'),
            'en':('ltr','Illustrative cases from commercial challenge to actionable next step.','../ar/case-studies.html')
          }
          expected_sections=['hero','library','boundary','cta']
          expected_filters=['all','market-access','distribution','supplier-readiness','rfq-buying']
          expected_ids=[f'case-{i:03d}' for i in range(1,7)]
          for lang,(direction,h1,other) in specs.items():
            text=(R/lang/'case-studies.html').read_text(encoding='utf-8'); s=BeautifulSoup(text,'html.parser'); f=[]
            if s.html.get('lang')!=lang or s.html.get('dir')!=direction:f.append('lang-dir')
            hs=s.find_all('h1')
            if len(hs)!=1 or hs[0].get_text(' ',strip=True)!=h1:f.append('h1')
            sections=[n.get('data-pg20-section') for n in s.select('[data-pg20-section]')]
            if sections!=expected_sections:f.append('sections:'+str(sections))
            cards=s.select('[data-orx-case-card]')
            ids=[c.get('data-case-id') for c in cards]
            if ids!=expected_ids:f.append('case-ids:'+str(ids))
            if len(set(ids))!=6:f.append('duplicate-case-ids')
            filters=[b.get('data-orx-case-filter') for b in s.select('[data-orx-case-filter]')]
            if filters!=expected_filters:f.append('filters:'+str(filters))
            if not s.select_one('[data-orx-case-count][aria-live]') and not s.select_one('[aria-live] [data-orx-case-count]'):
              # count lives inside aria-live parent in canonical markup
              parent=s.select_one('[data-orx-case-count]')
              if not parent or not parent.parent or parent.parent.get('aria-live')!='polite':f.append('live-count')
            if not s.select_one('[data-orx-case-empty][hidden]'):f.append('empty-state')
            if 'cases.json' in text or 'cases.json' in js:f.append('schema-drift-cases-json')
            if not s.find('a',href=other):f.append('language-switch')
            if not s.select_one('[data-orx-mega-trigger][aria-current="page"]'):f.append('explore-current')
            if not s.select_one('.orx-mega-menu a[href="case-studies.html"][aria-current="page"]'):f.append('mega-current')
            if s.select_one('.orx-mobile-nav a[href="case-studies.html"]'):f.append('mobile-ia-drift')
            if not s.select_one('footer[data-orx-global-footer="v1"] [data-orx-business-hours]'):f.append('footer')
            if len(s.select('a[href^="case-study-details.html?id=case-"]'))!=6:f.append('detail-links')
            if 'TARGET' in text or 'targetft' in text.lower():f.append('client-leak')
            if 'real client engagement' not in text.lower() and lang=='en':f.append('demo-boundary-en')
            if 'أعمال عملاء حقيقية' not in text and lang=='ar':f.append('demo-boundary-ar')
            canonical=s.find('link',rel='canonical')
            if not canonical or canonical.get('href')!=f'https://example.com/{lang}/case-studies.html':f.append('canonical')
            hreflangs={n.get('hreflang') for n in s.find_all('link',rel='alternate')}
            if not {'ar','en','x-default'}.issubset(hreflangs):f.append('hreflang')
            try:
              data=json.loads(s.find('script',attrs={'type':'application/ld+json'}).string)
              types={x.get('@type') for x in data.get('@graph',[])}
              if not {'WebPage','BreadcrumbList'}.issubset(types):f.append('schema')
              if types & {'Review','Rating','Offer','AggregateRating'}:f.append('prohibited-schema')
            except Exception:f.append('schema-json')
            icons=set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text)); missing=sorted(icons-sprite_ids)
            if missing:f.append('icons:'+str(missing))
            source['pages'][lang]={'failures':f,'sections':sections,'caseCount':len(cards)}; source['failures'] += [lang+':'+x for x in f]

          for script,label in [('.github/scripts/normalize_global_navigation.py','nav-drift'),('.github/scripts/normalize_global_footer.py','footer-drift')]:
            r=subprocess.run(['python',script,'--check'],capture_output=True,text=True)
            if r.returncode:
              source['failures'].append(label);source[label]=r.stdout+r.stderr
          (O/'source-report.json').write_text(json.dumps(source,ensure_ascii=False,indent=2),encoding='utf-8')

          rendered={'failures':[],'cases':[],'interaction':{}}
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--window-size=820,1600')
          srv=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);time.sleep(1)
          try:
            for lang in ('ar','en'):
              d=webdriver.Chrome(options=opts)
              try:
                for w in (390,820,1366,1536):
                  f=[]
                  try:
                    d.set_window_size(w,1600);d.get(f'http://127.0.0.1:8765/{lang}/case-studies.html')
                    WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg20-root]').get_attribute('data-pg20-ready')=='true')
                    if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-case-card]:not([hidden])'))!=6:f.append('visible-count')
                    if d.find_element(By.CSS_SELECTOR,'[data-orx-case-count]').text!='6':f.append('count-text')
                    if d.execute_script('return document.documentElement.scrollWidth')>d.execute_script('return document.documentElement.clientWidth')+1:f.append('overflow')
                    if d.find_element(By.TAG_NAME,'html').get_attribute('dir')!=('rtl' if lang=='ar' else 'ltr'):f.append('direction')
                    small=[]
                    for e in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                      if e.is_displayed() and e.rect['width'] and e.rect['height'] and (e.rect['width']<24 or e.rect['height']<24):small.append({'tag':e.tag_name,'w':round(e.rect['width'],1),'h':round(e.rect['height'],1),'text':e.text[:24]})
                    if small:f.append('touch:'+json.dumps(small,ensure_ascii=False))
                    if w>=1051:
                      t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]');t.click();time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='true':f.append('mega-open')
                      t.send_keys(Keys.ESCAPE);time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='false':f.append('mega-escape')
                    else:
                      op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]');op.click();time.sleep(.04);dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                      if dr.get_attribute('aria-hidden')!='false':f.append('drawer-open')
                      d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click();time.sleep(.04)
                      if dr.get_attribute('aria-hidden')!='true':f.append('drawer-close')
                  except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                  rendered['cases'].append({'lang':lang,'width':w,'failures':f});rendered['failures'] += [f'{lang}-{w}:{x}' for x in f]

                f=[]
                try:
                  d.set_window_size(820,1600);d.get(f'http://127.0.0.1:8765/{lang}/case-studies.html?focus=distribution');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg20-root]').get_attribute('data-pg20-ready')=='true')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-case-card]:not([hidden])'))!=2:f.append('distribution-count')
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-case-count]').text!='2':f.append('distribution-count-text')
                  active=d.find_element(By.CSS_SELECTOR,'[data-orx-case-filter="distribution"]')
                  if active.get_attribute('aria-pressed')!='true':f.append('distribution-active')
                  if 'focus=distribution' not in d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href'):f.append('language-preserve')
                  allb=d.find_element(By.CSS_SELECTOR,'[data-orx-case-filter="all"]');d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[0].focus();",allb);allb.send_keys(Keys.ENTER);time.sleep(.05)
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-case-card]:not([hidden])'))!=6:f.append('all-keyboard')
                  if 'focus=' in d.current_url:f.append('all-query-clear')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                rendered['interaction'][lang+'-filter']=f;rendered['failures'] += [lang+'-filter:'+x for x in f]

                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/case-studies.html');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg20-root]').get_attribute('data-pg20-ready')=='true')
                  d.execute_script("document.querySelectorAll('[data-orx-case-card]').forEach(x=>x.dataset.caseFocus='future-focus')")
                  b=d.find_element(By.CSS_SELECTOR,'[data-orx-case-filter="distribution"]');d.execute_script("arguments[0].scrollIntoView({block:'center'});",b);b.click();time.sleep(.05)
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-case-card]:not([hidden])'))!=0:f.append('empty-visible-cards')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-case-empty]').is_displayed():f.append('empty-state-hidden')
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-case-count]').text!='0':f.append('empty-count')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                rendered['interaction'][lang+'-empty']=f;rendered['failures'] += [lang+'-empty:'+x for x in f]
              finally:d.quit()
          finally:srv.terminate()

          (O/'rendered-report.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2),encoding='utf-8')
          status='PASS' if not source['failures'] and not rendered['failures'] else 'FAIL';(O/'run-status.txt').write_text(status+'\n',encoding='utf-8')
          print(status);print(source['failures']);print(rendered['failures'])
          if status!='PASS':raise SystemExit(1)
          PY
      - name: Commit PG20 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg20-case-studies || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG20 record Case Studies QA evidence"
          git pull --rebase origin main || true
          git push origin main || true
