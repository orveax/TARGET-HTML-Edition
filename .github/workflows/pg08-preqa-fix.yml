name: PG08 Pre-QA Asset Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg08-preqa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct English footer brand asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('en/service-details.html')
          s=p.read_text(encoding='utf-8')
          old='../assets/brand/origex-logo-mark-light.svg'
          new='../assets/brand/origex-logo-light.svg'
          if old not in s:
              raise SystemExit('expected pre-QA asset reference not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add en/service-details.html
          git commit -m 'PG08 correct English footer brand asset'
          git pull --rebase origin main
          git push origin HEAD:main
