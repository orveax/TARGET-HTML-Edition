name: PG10 Products Grid QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/products.html'
      - 'en/products.html'
      - 'assets/css/origex-products.css'
      - 'assets/js/origex-products.js'
      - 'assets/js/origex-ui.js'
      - 'assets/data/products.json'
      - 'assets/data/suppliers.json'
      - 'assets/media/demo/product-confectionery.svg'
      - 'assets/media/demo/product-ingredients.svg'
      - 'docs/page-design-profiles/pg10-products-grid-v1.md'
      - '.github/workflows/pg10-products-grid-qa.yml'

permissions:
  contents: write

concurrency:
  group: pg10-products-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Source data SEO and asset QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg10-products
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,time,sys

          required_product={'id','slug','nameAr','nameEn','brandId','categoryId','originCode','packSizeAr','packSizeEn','packagingAr','packagingEn','shelfLifeAr','shelfLifeEn','storageAr','storageEn','moq','availability','certifications','images','datasheet','brochure','supplierId','featured'}
          allowed_availability={'available','limited','on-request','unavailable'}
          categories={'ambient','beverages','dairy','frozen','confectionery','ingredients'}
          products=json.loads(Path('assets/data/products.json').read_text(encoding='utf-8'))
          suppliers=json.loads(Path('assets/data/suppliers.json').read_text(encoding='utf-8'))
          errors=[];data_checks={}
          ids=[p.get('id') for p in products]; supplier_ids={s.get('id') for s in suppliers}; brand_ids={f"brand-{s.get('id','').replace('supplier-','',1)}" for s in suppliers}
          data_checks['twelveProducts']=len(products)==12
          data_checks['uniqueProductIds']=len(ids)==len(set(ids))==12
          data_checks['requiredProductSchema']=all(required_product <= set(p) for p in products)
          data_checks['sixCategories']=set(p['categoryId'] for p in products)==categories
          data_checks['twoPerCategory']=all(sum(p['categoryId']==c for p in products)==2 for c in categories)
          data_checks['controlledAvailability']=all(p['availability'] in allowed_availability for p in products)
          data_checks['demoAvailabilityOnRequest']=all(p['availability']=='on-request' for p in products)
          data_checks['supplierRelations']=all(p['supplierId'] in supplier_ids and p['brandId'] in brand_ids for p in products)
          data_checks['productImagesExist']=all(p.get('images') and Path('assets/media/demo',p['images'][0]).exists() for p in products)
          data_checks['pg11CanonicalProduct']=any(p['id']=='prod-001' and p['nameEn']=='Concentrated Tomato Sauce — 400 g' and p['nameAr']=='صلصة طماطم مركزة — 400 جم' for p in products)
          if not all(data_checks.values()): errors.append('data:'+str({k:v for k,v in data_checks.items() if not v}))

          sprite=Path('assets/icons/sprite.svg').read_text(encoding='utf-8');sprite_ids=set(re.findall(r'<symbol\s+id="([^"]+)"',sprite))
          specs={
            'ar/products.html':{'lang':'ar','dir':'rtl','h1':'منتجات ببيانات تساعدك قبل إرسال الطلب.','canonical':'https://example.com/ar/products.html','disclosure':'جميع المنتجات والمناشئ وبيانات التعبئة وإشارات التوفر والعلاقات التجارية في هذه الصفحة بيانات خيالية أو توضيحية للقالب ويجب استبدالها ببيانات أعمال موثقة قبل النشر.'},
            'en/products.html':{'lang':'en','dir':'ltr','h1':'Products presented with the information you need before enquiring.','canonical':'https://example.com/en/products.html','disclosure':'All catalogue entities, origins, packaging, availability labels and commercial relationships on this page are fictional or illustrative template data. Replace them with verified business data before publication.'}
          }
          class P(HTMLParser):
            def __init__(self): super().__init__();self.html={};self.h1=[];self.buf=[];self.inh=False;self.ids=[];self.assets=[];self.icons=[];self.sections=[];self.selects=[];self.inputs=[]
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='html':self.html=d
              if d.get('id'):self.ids.append(d['id'])
              if d.get('data-pg10-section'):self.sections.append(d['data-pg10-section'])
              if t=='h1':self.inh=True;self.buf=[]
              if t=='select':self.selects.append(d)
              if t=='input':self.inputs.append(d)
              if t in ('link','script','img'):
                k='href' if t=='link' else 'src'
                if d.get(k):self.assets.append(d[k])
              if t=='use' and d.get('href','').startswith('../assets/icons/sprite.svg#'):self.icons.append(d['href'].split('#',1)[1])
            def handle_data(self,d):
              if self.inh:self.buf.append(d)
            def handle_endtag(self,t):
              if t=='h1':self.inh=False;self.h1.append(''.join(self.buf).strip())
          page_results=[]
          for rel,s in specs.items():
            text=Path(rel).read_text(encoding='utf-8');p=P();p.feed(text);missing=sorted(set(p.icons)-sprite_ids)
            checks={
              'languageDirection':p.html.get('lang')==s['lang'] and p.html.get('dir')==s['dir'],
              'singleH1':len(p.h1)==1 and p.h1[0]==s['h1'],
              'canonical':f'rel="canonical" href="{s["canonical"]}"' in text,
              'hreflang':all(x in text for x in ('hreflang="ar"','hreflang="en"','hreflang="x-default"')),
              'openGraph':all(x in text for x in ('og:type','og:site_name','og:title','og:description','og:url','og:image')),
              'structuredData':'BreadcrumbList' in text and 'WebPage' in text and '"Product"' not in text,
              'visibleBreadcrumb':'orx-breadcrumb' in text,
              'demoDisclosure':s['disclosure'] in text,
              'threeCompositionSections':set(p.sections)=={'hero','catalogue','cta'} and len(p.sections)==3,
              'searchControl':'data-pg10-search' in text and 'type="search"' in text,
              'categoryFilter':'data-pg10-category' in text and all(f'value="{c}"' in text for c in categories),
              'brandFilter':'data-pg10-brand' in text,
              'originFilter':'data-pg10-origin' in text,
              'pagination':'data-pg10-pagination' in text,
              'datasetLinks':'../assets/data/products.json' in text and '../assets/data/suppliers.json' in text,
              'productRuntime':'../assets/js/origex-products.js' in text,
              'sharedRuntime':'../assets/js/origex-ui.js' in text,
              'staticProductCurrent':'href="products.html" aria-current="page"' in text,
              'uniqueIDs':len(p.ids)==len(set(p.ids)),
              'noClientCDNLeakage':'TARGET' not in text and 'targetft' not in text.lower() and 'cdn.' not in text.lower(),
              'iconReferencesResolve':not missing
            }
            local=[]
            for a in p.assets:
              if a.startswith(('http://','https://','data:','#')):continue
              clean=a.split('?',1)[0].split('#',1)[0]
              if clean:local.append(((Path(rel).parent/clean).resolve()).exists())
            checks['localAssets']=all(local)
            bad=[k for k,v in checks.items() if not v]
            if bad:errors.append(f'{rel}:{bad};missingIcons={missing}')
            page_results.append({'page':rel,'checks':checks,'sections':p.sections,'missingIcons':missing,'pass':not bad})
          for req in ('assets/css/origex-products.css','assets/js/origex-products.js','assets/data/products.json','assets/data/suppliers.json','docs/page-design-profiles/pg10-products-grid-v1.md'):
            if not Path(req).exists():errors.append('missing '+req)
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'dataChecks':data_checks,'pages':page_results,'errors':errors}
          Path('qa/pg10-products/source-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Start browser QA services
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version | tee qa/pg10-products/browser-baseline.txt
          chromedriver --version | tee -a qa/pg10-products/browser-baseline.txt
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/origex-http.log 2>&1 &
          chromedriver --port=9515 --allowed-origins='*' >/tmp/origex-chromedriver.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/en/products.html >/dev/null
          curl -fsS http://127.0.0.1:9515/status >/dev/null

      - name: Responsive search filter pagination and navigation QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,sys
          from pathlib import Path
          WD='http://127.0.0.1:9515';OUT=Path('qa/pg10-products')
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();r=urllib.request.Request(WD+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=30) as f:b=json.loads(f.read().decode())
            return b.get('value') if isinstance(b,dict) else b
          def session(w,h):
            v=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1',f'--window-size={w},{h}']}}}});sid=v['sessionId'];req('POST',f'/session/{sid}/window/rect',{'width':w,'height':h,'x':0,'y':0});return sid
          def js(sid,s,args=None):return req('POST',f'/session/{sid}/execute/sync',{'script':s,'args':args or []})
          def load(sid,url,delay=.85):req('POST',f'/session/{sid}/url',{'url':url});time.sleep(delay)
          pages=[('ar','/ar/products.html','rtl'),('en','/en/products.html','ltr')];views=[(390,844),(820,1180),(1366,900),(1536,960)];results=[];errors=[]
          metric="""const w=arguments[0],doc=document.documentElement;const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!e.closest('[aria-hidden=\"true\"]')};const off=[...document.querySelectorAll('body *')].filter(e=>{if(!vis(e)||getComputedStyle(e).position==='fixed')return false;const r=e.getBoundingClientRect();return r.right>w+1||r.left<-1}).length;const b=[...document.querySelectorAll('button,.orx-btn')].filter(vis).map(e=>e.getBoundingClientRect().height);return{dir:doc.dir,overflow:doc.scrollWidth>doc.clientWidth+1,off,minButton:b.length?Math.min(...b):0,h1:!!document.querySelector('h1'),sections:document.querySelectorAll('[data-pg10-section]').length,cards:document.querySelectorAll('[data-product-id]').length,count:document.querySelector('[data-pg10-count]')?.textContent||'',error:!!document.querySelector('.orx-products-error'),images:[...document.querySelectorAll('[data-product-id] img')].every(i=>i.complete&&i.naturalWidth>0)};"""
          for lang,path,dirn in pages:
            for w,h in views:
              sid=session(w,h)
              try:
                load(sid,'http://127.0.0.1:4173'+path);m=js(sid,metric,[w]);required=44 if w<=1024 else 40
                checks={'direction':m['dir']==dirn,'noOverflow':not m['overflow'] and m['off']==0,'touchTargets':m['minButton']>=required,'h1':m['h1'],'threeSections':m['sections']==3,'sixPageCards':m['cards']==6,'datasetLoaded':not m['error'],'imagesLoaded':m['images'],'resultCount12':'12' in m['count']}
                if not all(checks.values()):errors.append(f'{lang}-{w}:{checks}:{m}')
                results.append({'lang':lang,'viewport':w,'checks':checks,'metrics':m,'pass':all(checks.values())})
              finally:
                try:req('DELETE',f'/session/{sid}')
                except:pass

            sid=session(1366,900)
            try:
              base='http://127.0.0.1:4173'+path;load(sid,base)
              interaction=js(sid,"""const cat=document.querySelector('[data-pg10-category]'),brand=document.querySelector('[data-pg10-brand]'),origin=document.querySelector('[data-pg10-origin]'),search=document.querySelector('[data-pg10-search]'),reset=document.querySelector('[data-pg10-reset]');const visible=()=>document.querySelectorAll('[data-product-id]').length;cat.value='beverages';cat.dispatchEvent(new Event('change',{bubbles:true}));const catOk=visible()===2;reset.click();brand.value='brand-nordvale';brand.dispatchEvent(new Event('change',{bubbles:true}));const brandOk=visible()===2;reset.click();origin.value='NL';origin.dispatchEvent(new Event('change',{bubbles:true}));const originOk=visible()===2;reset.click();search.value=arguments[0];search.dispatchEvent(new Event('input',{bubbles:true}));return new Promise(r=>setTimeout(()=>r({catOk,brandOk,originOk,searchCards:visible(),count:document.querySelector('[data-pg10-count]').textContent}),220));""",['كركديه' if lang=='ar' else 'Hibiscus'])
              if not (interaction['catOk'] and interaction['brandOk'] and interaction['originOk'] and interaction['searchCards']==1 and '1' in interaction['count']):errors.append(f'{lang}: filter/search interaction {interaction}')
              reset=js(sid,"""document.querySelector('[data-pg10-reset]').click();return {cards:document.querySelectorAll('[data-product-id]').length,count:document.querySelector('[data-pg10-count]').textContent};""")
              if reset['cards']!=6 or '12' not in reset['count']:errors.append(f'{lang}: reset {reset}')
              pagination=js(sid,"""const nav=document.querySelector('[data-pg10-pagination]');const current=nav.querySelector('[aria-current=\"page\"]');const buttons=[...nav.querySelectorAll('button')];const second=buttons.find(b=>b.textContent.trim()==='2');if(!current||!second)return false;second.click();return document.querySelector('[data-product-id]')?.dataset.productId==='prod-007'&&nav.querySelector('[aria-current=\"page\"]')?.textContent.trim()==='2';""")
              if not pagination:errors.append(f'{lang}: pagination')
              empty=js(sid,"""document.querySelector('[data-pg10-reset]').click();const s=document.querySelector('[data-pg10-search]');s.value='zz-no-product-zz';s.dispatchEvent(new Event('input',{bubbles:true}));return new Promise(r=>setTimeout(()=>r(!!document.querySelector('.orx-products-empty')&&document.querySelectorAll('[data-product-id]').length===0),220));""")
              if not empty:errors.append(f'{lang}: empty state')
              nav=js(sid,"""document.querySelector('[data-pg10-reset]').click();const t=document.querySelector('[data-orx-mega-trigger]');t.click();const m=document.getElementById(t.getAttribute('aria-controls'));const c=m?.querySelector('a[data-orx-product-link=\"products.html\"][aria-current=\"page\"]');const p=m?.querySelector('a[data-orx-product-link=\"product-categories.html\"]');return !!c&&!!p&&!m.hidden;""")
              if not nav:errors.append(f'{lang}: desktop Product navigation')
              routes=js(sid,"""const c=document.querySelector('[data-product-id]');return c?{details:c.querySelector('a[href^=\"product-details.html?id=\"]')?.getAttribute('href'),rfq:c.querySelector('a[href^=\"rfq.html?product=\"]')?.getAttribute('href')}:null;""")
              if not routes or not routes['details'] or not routes['rfq']:errors.append(f'{lang}: product routes {routes}')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass

            sid=session(390,844)
            try:
              load(sid,'http://127.0.0.1:4173'+path)
              bnav=js(sid,"""document.querySelector('[data-orx-drawer-open]').click();const d=document.querySelector('[data-orx-mobile-drawer]');const current=d.querySelector('a[data-orx-product-link=\"products.html\"][aria-current=\"page\"]');const cats=d.querySelector('a[data-orx-product-link=\"product-categories.html\"]');const ok=d.getAttribute('aria-hidden')==='false'&&current&&cats;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return !!ok&&d.getAttribute('aria-hidden')==='true';""")
              if not bnav:errors.append(f'{lang}: mobile Product navigation')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass

            sid=session(820,1180)
            try:
              load(sid,'http://127.0.0.1:4173'+path+'?category=frozen')
              deep=js(sid,"""return {category:document.querySelector('[data-pg10-category]')?.value,cards:document.querySelectorAll('[data-product-id]').length,count:document.querySelector('[data-pg10-count]')?.textContent||'',allFrozen:[...document.querySelectorAll('[data-product-id]')].every(c=>c.dataset.category==='frozen')};""")
              if not (deep['category']=='frozen' and deep['cards']==2 and deep['allFrozen'] and '2' in deep['count']):errors.append(f'{lang}: category deep link {deep}')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          (OUT/'rendered-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8');(OUT/'run-status.txt').write_text('PASS\n' if not errors else 'FAIL\n')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Record QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add qa/pg10-products
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG10 record Products Grid QA evidence'
          git pull --rebase origin main
          git push origin HEAD:main
