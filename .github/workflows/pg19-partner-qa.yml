name: PG19 Become Partner QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/become-partner.html'
      - 'en/become-partner.html'
      - 'assets/css/origex-partner.css'
      - 'assets/js/origex-partner.js'
      - 'assets/data/markets.json'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-shell.css'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg19-become-partner-v1.md'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg19-partner-qa.yml'

concurrency:
  group: pg19-partner-qa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG19 source rendered and interaction QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,subprocess,time,tempfile,re
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait,Select

          R=Path('.'); O=R/'qa/pg19-partner'; O.mkdir(parents=True,exist_ok=True)
          source={'failures':[],'pages':{},'data':{},'runtime':{}}

          markets=json.loads((R/'assets/data/markets.json').read_text(encoding='utf-8'))
          ids=[m.get('id') for m in markets]; df=[]
          if len(markets)!=6: df.append(f'market-count:{len(markets)}')
          if len(ids)!=len(set(ids)): df.append('duplicate-market-ids')
          for m in markets:
            for k in ('id','countryCode','nameAr','nameEn','summaryAr','summaryEn','channelTagsAr','channelTagsEn'):
              if not m.get(k): df.append(f'{m.get("id")}:{k}')
          source['data']={'marketCount':len(markets),'failures':df}; source['failures']+=df

          js=(R/'assets/js/origex-partner.js').read_text(encoding='utf-8'); rf=[]; compact=js.replace(' ','')
          for bad in ('localStorage','sessionStorage','XMLHttpRequest','method:"POST"',"method:'POST'"):
            if bad in js: rf.append('forbidden:'+bad)
          for required in ('fetch(marketsUrl','event.preventDefault()','10*1024*1024','validateGroup'):
            if required.replace(' ','') not in compact: rf.append('missing:'+required)
          for ext in ('pdf','jpg','jpeg','png','doc','docx'):
            if f"'{ext}'" not in js: rf.append('file-extension:'+ext)
          source['runtime']={'failures':rf}; source['failures']+=rf

          sprite=(R/'assets/icons/sprite.svg').read_text(encoding='utf-8'); sprite_ids=set(re.findall(r'<symbol[^>]+id="([^"]+)"',sprite))
          specs={
            'ar':('rtl','شراكة التوزيع تبدأ بفهم السوق والقدرة التشغيلية.','../en/become-partner.html'),
            'en':('ltr','Distribution partnerships start with market and operating capability.','../ar/become-partner.html')
          }
          required_names=['companyName','companyRole','contactName','email','marketId','coverageDescription','consent']
          expected_sections=['hero','value','criteria','disclosure','form','cta']
          for lang,(direction,h1,other) in specs.items():
            text=(R/lang/'become-partner.html').read_text(encoding='utf-8'); s=BeautifulSoup(text,'html.parser'); f=[]
            if s.html.get('lang')!=lang or s.html.get('dir')!=direction:f.append('lang-dir')
            hs=s.find_all('h1')
            if len(hs)!=1 or hs[0].get_text(' ',strip=True)!=h1:f.append('h1')
            sections=[n.get('data-pg19-section') for n in s.select('[data-pg19-section]')]
            if sections!=expected_sections:f.append('sections:'+str(sections))
            if not s.select_one('[data-pg19-root][data-markets-url="../assets/data/markets.json"]'):f.append('root-data')
            if not s.find('a',href=other):f.append('language-switch')
            form=s.select_one('[data-orx-partner-form]')
            for name in required_names:
              n=form.find(attrs={'name':name}) if form else None
              if not n or not n.has_attr('required'):f.append('required:'+name)
            if not form or not form.select_one('fieldset[data-orx-partner-channels]'):f.append('channel-fieldset')
            if not form or not form.select_one('fieldset[data-orx-partner-categories]'):f.append('category-fieldset')
            if form and len(form.select('input[name="channels"]'))!=6:f.append('channel-count')
            if form and len(form.select('input[name="categories"]'))!=6:f.append('category-count')
            fi=form.select_one('[data-orx-partner-file]') if form else None
            if not fi or fi.get('accept')!='.pdf,.jpg,.jpeg,.png,.doc,.docx':f.append('file-contract')
            if not form or not form.select_one('[data-orx-partner-error][role="alert"]') or not form.select_one('[data-orx-partner-success][role="status"]'):f.append('statuses')
            if not s.select_one('footer[data-orx-global-footer="v1"] [data-orx-business-hours]'):f.append('footer')
            top=s.select_one('a.orx-nav-link[href="market-access.html"][aria-current="page"]')
            mega=s.select_one('.orx-mega-menu a[href="become-partner.html"][aria-current="page"]')
            mobile=s.select_one('.orx-mobile-nav a[href="become-partner.html"][aria-current="page"]')
            if not top:f.append('market-parent-current')
            if not mega:f.append('mega-current')
            if not mobile:f.append('mobile-current')
            if 'TARGET' in text or 'targetft' in text.lower():f.append('client-leak')
            for phrase in ('guaranteed appointment','exclusive territory granted','distribution rights granted','territory reserved'):
              if phrase in text.lower():f.append('unsupported-claim:'+phrase)
            icons=set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text)); missing=sorted(icons-sprite_ids)
            if missing:f.append('icons:'+str(missing))
            source['pages'][lang]={'failures':f,'sections':sections}; source['failures'] += [lang+':'+x for x in f]

          for script,label in [('.github/scripts/normalize_global_navigation.py','nav-drift'),('.github/scripts/normalize_global_footer.py','footer-drift')]:
            r=subprocess.run(['python',script,'--check'],capture_output=True,text=True)
            if r.returncode:
              source['failures'].append(label); source[label]=r.stdout+r.stderr
          (O/'source-report.json').write_text(json.dumps(source,ensure_ascii=False,indent=2),encoding='utf-8')

          rendered={'failures':[],'cases':[],'interaction':{}}
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--window-size=820,1600')
          srv=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);time.sleep(1)
          try:
            for lang in ('ar','en'):
              d=webdriver.Chrome(options=opts)
              try:
                for w in (390,820,1366,1536):
                  f=[]
                  try:
                    d.set_window_size(w,1600);d.get(f'http://127.0.0.1:8765/{lang}/become-partner.html')
                    WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets') in ('ready','error'))
                    if d.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets')!='ready':f.append('markets-load')
                    if len(Select(d.find_element(By.NAME,'marketId')).options)!=7:f.append('market-options')
                    if len(d.find_elements(By.CSS_SELECTOR,'[data-pg19-section]'))!=6:f.append('section-count')
                    if d.execute_script('return document.documentElement.scrollWidth')>d.execute_script('return document.documentElement.clientWidth')+1:f.append('overflow')
                    if d.find_element(By.TAG_NAME,'html').get_attribute('dir')!=('rtl' if lang=='ar' else 'ltr'):f.append('direction')
                    small=[]
                    for e in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                      if e.is_displayed() and e.rect['width'] and e.rect['height'] and (e.rect['width']<24 or e.rect['height']<24):small.append({'tag':e.tag_name,'name':e.get_attribute('name'),'w':round(e.rect['width'],1),'h':round(e.rect['height'],1)})
                    if small:f.append('touch:'+json.dumps(small,ensure_ascii=False))
                    if w>=1051:
                      t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]');t.click();time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='true':f.append('mega-open')
                      t.send_keys(Keys.ESCAPE);time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='false':f.append('mega-escape')
                    else:
                      op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]');op.click();time.sleep(.04);dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                      if dr.get_attribute('aria-hidden')!='false':f.append('drawer-open')
                      d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click();time.sleep(.04)
                      if dr.get_attribute('aria-hidden')!='true':f.append('drawer-close')
                  except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                  rendered['cases'].append({'lang':lang,'width':w,'failures':f});rendered['failures'] += [f'{lang}-{w}:{x}' for x in f]

                f=[]
                try:
                  d.set_window_size(820,1600);d.get(f'http://127.0.0.1:8765/{lang}/become-partner.html?market=market-ae');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets')=='ready')
                  if d.find_element(By.NAME,'marketId').get_attribute('value')!='market-ae':f.append('prefill')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-market-summary]').is_displayed():f.append('summary')
                  if 'market=market-ae' not in d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href'):f.append('language-preserve')
                  d.get(f'http://127.0.0.1:8765/{lang}/become-partner.html?market=bad-id');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets')=='ready')
                  if d.find_element(By.NAME,'marketId').get_attribute('value'):f.append('invalid-fallback')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-query-notice]').is_displayed():f.append('invalid-notice')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                rendered['interaction'][lang+'-query']=f;rendered['failures'] += [lang+'-query:'+x for x in f]

                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/become-partner.html');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets')=='ready')
                  for n,v in {'companyName':'Demo Distribution LLC','contactName':'Demo Partner','email':'partner@example.com','coverageDescription':'Demo city and channel coverage'}.items():d.find_element(By.NAME,n).send_keys(v)
                  Select(d.find_element(By.NAME,'companyRole')).select_by_value('distributor');Select(d.find_element(By.NAME,'marketId')).select_by_value('market-qa')
                  c=d.find_element(By.NAME,'consent');d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[0].focus();",c);c.send_keys(Keys.SPACE)
                  b=d.find_element(By.CSS_SELECTOR,'button[type="submit"]');d.execute_script("arguments[0].scrollIntoView({block:'center'});",b);b.send_keys(Keys.ENTER);time.sleep(.08)
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-partner-success]').is_displayed():f.append('group-validation-bypassed')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-channels-error]').is_displayed():f.append('channel-error')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-categories-error]').is_displayed():f.append('category-error')
                  ch=d.find_elements(By.NAME,'channels')[0];cat=d.find_elements(By.NAME,'categories')[0]
                  d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[0].click();",ch);d.execute_script("arguments[0].click();",cat)
                  b=d.find_element(By.CSS_SELECTOR,'button[type="submit"]');d.execute_script("arguments[0].scrollIntoView({block:'center'});",b);b.send_keys(Keys.ENTER);time.sleep(.1)
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-success]').is_displayed():f.append('valid-no-success')
                  if d.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-channel-count')!='1':f.append('channel-count-state')
                  if d.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-category-count')!='1':f.append('category-count-state')
                  fetches=d.execute_script("return performance.getEntriesByType('resource').filter(x=>x.initiatorType==='fetch').map(x=>x.name)")
                  if any('/assets/data/markets.json' not in x for x in fetches):f.append('unexpected-fetch:'+str(fetches))
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                rendered['interaction'][lang+'-validation']=f;rendered['failures'] += [lang+'-validation:'+x for x in f]

                tmp=Path(tempfile.gettempdir());ok=tmp/'pg19-demo.pdf';bad=tmp/'pg19-demo.exe';ok.write_bytes(b'%PDF');bad.write_bytes(b'x');f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/become-partner.html');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg19-root]').get_attribute('data-pg19-markets')=='ready')
                  inp=d.find_element(By.CSS_SELECTOR,'[data-orx-partner-file]');inp.send_keys(str(bad));time.sleep(.05)
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-partner-error]').is_displayed():f.append('invalid-file')
                  inp.send_keys(str(ok));time.sleep(.05)
                  if ok.name not in d.find_element(By.CSS_SELECTOR,'[data-orx-partner-file-name]').text:f.append('valid-file-name')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:150])
                rendered['interaction'][lang+'-file']=f;rendered['failures'] += [lang+'-file:'+x for x in f]
              finally:d.quit()
          finally:srv.terminate()

          (O/'rendered-report.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2),encoding='utf-8')
          status='PASS' if not source['failures'] and not rendered['failures'] else 'FAIL';(O/'run-status.txt').write_text(status+'\n',encoding='utf-8')
          print(status);print(source['failures']);print(rendered['failures'])
          if status!='PASS':raise SystemExit(1)
          PY
      - name: Commit PG19 QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg19-partner || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG19 record partner QA evidence"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
