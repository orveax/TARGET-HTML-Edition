name: PG26 FAQ QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/faq.html'
      - 'en/faq.html'
      - 'assets/css/origex-faq.css'
      - 'assets/js/origex-faq.js'
      - 'assets/js/origex-ui.js'
      - 'assets/icons/sprite.svg'
      - 'docs/page-design-profiles/pg26-faq-v1.md'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg26-faq-qa.yml'

concurrency:
  group: pg26-faq-qa
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG26 source and rendered QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,subprocess,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          R=Path('.')
          O=R/'qa/pg26-faq'; O.mkdir(parents=True,exist_ok=True)
          source={'failures':[],'pages':{},'runtime':{}}
          js=(R/'assets/js/origex-faq.js').read_text(encoding='utf-8')
          rf=[]
          for bad in ('fetch(','XMLHttpRequest','localStorage','sessionStorage'):
            if bad in js: rf.append('forbidden-runtime:'+bad)
          for required in ('history.replaceState','data-pg26-category','data-faq-item','data-pg26-empty','pg26Ready','orx-mobile-nav a[lang]'):
            if required not in js: rf.append('runtime-missing:'+required)
          source['runtime']={'failures':rf}; source['failures']+=rf

          sprite=(R/'assets/icons/sprite.svg').read_text(encoding='utf-8')
          sprite_ids=set(re.findall(r'<symbol[^>]+id="([^"]+)"',sprite))
          groups_expected=['buyers','suppliers','products','rfq','distribution','demo']
          specs={'ar':('rtl','إجابات أوضح قبل أن تبدأ المحادثة التجارية.','https://example.com/ar/faq.html','../en/faq.html'),'en':('ltr','Clearer answers before the commercial conversation starts.','https://example.com/en/faq.html','../ar/faq.html')}
          for lang,(direction,h1,canonical,other) in specs.items():
            text=(R/lang/'faq.html').read_text(encoding='utf-8'); s=BeautifulSoup(text,'html.parser'); f=[]
            if s.html.get('lang')!=lang or s.html.get('dir')!=direction: f.append('lang-dir')
            hs=s.find_all('h1')
            if len(hs)!=1 or hs[0].get_text(' ',strip=True)!=h1: f.append('h1')
            items=s.select('[data-faq-item]'); groups=[x.get('data-faq-group') for x in s.select('[data-faq-group]')]
            if len(items)!=18: f.append('faq-count:'+str(len(items)))
            if groups!=groups_expected: f.append('groups:'+str(groups))
            for g in groups_expected:
              n=len(s.select(f'[data-faq-item][data-faq-category="{g}"]'))
              if n!=3: f.append(f'group-count:{g}:{n}')
            triggers=s.select('[data-orx-accordion-trigger]'); controls=[]
            if len(triggers)!=18: f.append('accordion-count:'+str(len(triggers)))
            for t in triggers:
              if t.name!='button': f.append('accordion-not-button')
              cid=t.get('aria-controls'); controls.append(cid); panel=s.find(id=cid) if cid else None
              if not cid or not panel: f.append('accordion-control'); continue
              if panel.get('role')!='region' or panel.get('aria-labelledby')!=t.get('id'): f.append('accordion-region:'+cid)
            if len(controls)!=len(set(controls)): f.append('accordion-control-duplicate')
            if len(s.select('[data-pg26-category]'))!=7: f.append('category-buttons')
            if not s.select_one('[data-pg26-search]'): f.append('search')
            result=s.select_one('[data-pg26-result-count]')
            if not (result and (result.get('aria-live')=='polite' or result.find_parent(attrs={'aria-live':'polite'}))): f.append('result-live')
            if not s.select_one('[data-pg26-empty][hidden]') or not s.select_one('[data-pg26-reset]'): f.append('empty-reset')
            if not s.select_one('[data-orx-mega-trigger][aria-current="page"]'): f.append('explore-current')
            if not s.select_one('.orx-mega-menu a[href="faq.html"][aria-current="page"]'): f.append('mega-current')
            if not s.select_one('.orx-mobile-nav a[href="faq.html"][aria-current="page"]'): f.append('mobile-current')
            if not s.find('a',class_='orx-lang-switch',href=lambda x:x and other in x): f.append('language-switch')
            footer=s.select('footer[data-orx-global-footer="v1"]')
            if len(footer)!=1 or not footer[0].select_one('[data-orx-business-hours]'): f.append('footer')
            c=s.find('link',rel='canonical')
            if not c or c.get('href')!=canonical: f.append('canonical')
            if not {'ar','en','x-default'}.issubset({x.get('hreflang') for x in s.find_all('link',rel='alternate')}): f.append('hreflang')
            try:
              data=json.loads(s.find('script',attrs={'type':'application/ld+json'}).string); types={x.get('@type') for x in data.get('@graph',[])}
              if not {'WebPage','BreadcrumbList'}.issubset(types): f.append('schema')
              if types & {'Product','Offer','Review','Rating','AggregateRating'}: f.append('prohibited-schema')
            except Exception: f.append('schema-json')
            if 'TARGET' in text or 'targetft' in text.lower(): f.append('client-leak')
            combined=s.get_text(' ',strip=True).lower()
            if 'demo' not in combined: f.append('demo-boundary')
            if any(x in combined for x in ('guaranteed roi','guaranteed result','100% guaranteed','نتيجة مضمونة','مضمون 100%')): f.append('inflated-claim')
            if (R/'assets/data/faq.json').exists(): f.append('unapproved-faq-json')
            missing=sorted(set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text))-sprite_ids)
            if missing: f.append('icons:'+str(missing))
            if lang=='ar':
              if 'هل إرسال المنتج يعني قبوله؟' not in text or 'لا. التقديم يتيح مراجعة المعلومات فقط، ولا يعني قبول المنتج أو تمثيله أو توزيعه.' not in text: f.append('canonical-submission-qa')
              if 'هل الأسعار موجودة داخل القالب؟' not in text or 'يمكن إضافتها حسب نموذج العمل، لكن Demo يركز على RFQ لأن الأسعار التجارية تعتمد غالبًا على الكمية والسوق والشروط.' not in text: f.append('canonical-price-qa')
            source['pages'][lang]={'failures':f,'faqItems':len(items),'groups':groups}; source['failures'] += [lang+':'+x for x in f]
          for script,label in [('.github/scripts/normalize_global_navigation.py','nav-drift'),('.github/scripts/normalize_global_footer.py','footer-drift')]:
            r=subprocess.run(['python',script,'--check'],capture_output=True,text=True)
            if r.returncode: source['failures'].append(label); source[label]=r.stdout+r.stderr
          (O/'source-report.json').write_text(json.dumps(source,ensure_ascii=False,indent=2),encoding='utf-8')

          rendered={'failures':[],'cases':[],'interaction':{}}
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=820,1900')
          srv=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); time.sleep(1)
          try:
            for lang in ('ar','en'):
              d=webdriver.Chrome(options=opts)
              try:
                for width in (390,820,1366,1536):
                  f=[]
                  try:
                    d.set_window_size(width,1900); d.get(f'http://127.0.0.1:8765/{lang}/faq.html')
                    WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true')
                    root=d.find_element(By.CSS_SELECTOR,'[data-pg26-root]')
                    if root.get_attribute('data-pg26-results')!='18': f.append('initial-results')
                    if len([x for x in d.find_elements(By.CSS_SELECTOR,'[data-faq-item]') if x.is_displayed()])!=18: f.append('visible-items')
                    if d.execute_script('return document.documentElement.scrollWidth')>d.execute_script('return document.documentElement.clientWidth')+1: f.append('overflow')
                    if d.find_element(By.TAG_NAME,'html').get_attribute('dir')!=('rtl' if lang=='ar' else 'ltr'): f.append('direction')
                    small=[]
                    for e in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                      if e.is_displayed() and e.rect['width'] and e.rect['height'] and (e.rect['width']<24 or e.rect['height']<24): small.append((e.tag_name,round(e.rect['width'],1),round(e.rect['height'],1)))
                    if small: f.append('touch:'+str(small[:5]))
                    if width>=1051:
                      t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]'); t.click(); time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='true': f.append('mega-open')
                      t.send_keys(Keys.ESCAPE); time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='false': f.append('mega-escape')
                    else:
                      op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]'); op.click(); time.sleep(.04); dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                      if dr.get_attribute('aria-hidden')!='false': f.append('drawer-open')
                      d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click(); time.sleep(.04)
                      if dr.get_attribute('aria-hidden')!='true': f.append('drawer-close')
                  except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                  rendered['cases'].append({'lang':lang,'width':width,'failures':f}); rendered['failures'] += [f'{lang}-{width}:{x}' for x in f]
                tests={}
                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/faq.html'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true')
                  q=d.find_element(By.ID,f'faq-{lang}-q02'); a=d.find_element(By.ID,f'faq-{lang}-a02'); q.send_keys(Keys.ENTER); time.sleep(.05)
                  if q.get_attribute('aria-expanded')!='true' or not a.is_displayed(): f.append('enter-open')
                  q.send_keys(Keys.SPACE); time.sleep(.05)
                  if q.get_attribute('aria-expanded')!='false' or a.is_displayed(): f.append('space-close')
                except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                tests['accordion']=f
                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/faq.html'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true'); d.find_element(By.CSS_SELECTOR,'[data-pg26-category="rfq"]').click(); time.sleep(.05); root=d.find_element(By.CSS_SELECTOR,'[data-pg26-root]')
                  if root.get_attribute('data-pg26-category')!='rfq' or root.get_attribute('data-pg26-results')!='3': f.append('filter-state')
                  visible=[x.get_attribute('data-faq-group') for x in d.find_elements(By.CSS_SELECTOR,'[data-faq-group]') if x.is_displayed()]
                  if visible!=['rfq']: f.append('visible-groups:'+str(visible))
                  if 'category=rfq' not in d.current_url: f.append('url')
                except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                tests['category']=f
                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/faq.html?category=rfq&q=endpoint'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true'); root=d.find_element(By.CSS_SELECTOR,'[data-pg26-root]')
                  if root.get_attribute('data-pg26-category')!='rfq' or root.get_attribute('data-pg26-query')!='endpoint' or root.get_attribute('data-pg26-results')!='1': f.append('query-hydration')
                  links=d.find_elements(By.CSS_SELECTOR,'.orx-lang-switch,.orx-mobile-nav a[lang]')
                  if len(links)<2 or any('category=rfq' not in a.get_attribute('href') or 'q=endpoint' not in a.get_attribute('href') for a in links): f.append('language-state')
                except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                tests['query-language']=f
                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/faq.html?category=invalid'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true'); root=d.find_element(By.CSS_SELECTOR,'[data-pg26-root]')
                  if root.get_attribute('data-pg26-category')!='all' or root.get_attribute('data-pg26-results')!='18': f.append('state')
                  if 'category=' in d.current_url: f.append('url')
                except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                tests['invalid-category']=f
                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/faq.html?q=zzzzzz'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg26-root]').get_attribute('data-pg26-ready')=='true'); root=d.find_element(By.CSS_SELECTOR,'[data-pg26-root]'); empty=d.find_element(By.CSS_SELECTOR,'[data-pg26-empty]')
                  if root.get_attribute('data-pg26-results')!='0' or not empty.is_displayed(): f.append('empty')
                  d.find_element(By.CSS_SELECTOR,'[data-pg26-reset]').click(); time.sleep(.05)
                  if root.get_attribute('data-pg26-results')!='18' or empty.is_displayed(): f.append('reset')
                  search=d.find_element(By.CSS_SELECTOR,'[data-pg26-search]'); search.send_keys('endpoint'); time.sleep(.05); search.send_keys(Keys.ESCAPE); time.sleep(.05)
                  if root.get_attribute('data-pg26-query')!='' or search.get_attribute('value')!='': f.append('escape-clear')
                except Exception as e: f.append(type(e).__name__+':'+str(e)[:120])
                tests['empty-reset-escape']=f
                for name,fails in tests.items(): rendered['interaction'][lang+'-'+name]=fails; rendered['failures'] += [lang+'-'+name+':'+x for x in fails]
              finally: d.quit()
          finally: srv.terminate()
          (O/'rendered-report.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2),encoding='utf-8')
          status='PASS' if not source['failures'] and not rendered['failures'] else 'FAIL'; (O/'run-status.txt').write_text(status+'\n',encoding='utf-8')
          print(status,source['failures'],rendered['failures'])
          if status!='PASS': raise SystemExit(1)
          PY
      - name: Commit PG26 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg26-faq || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG26 record FAQ QA evidence"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
