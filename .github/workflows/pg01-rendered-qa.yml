name: PG01 Rendered Visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.pg01-rendered-trigger'
      - 'ar/index.html'
      - 'en/index.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/workflows/pg01-rendered-qa.yml'

permissions:
  contents: write

jobs:
  rendered-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner browser baseline
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          chromedriver --version

      - name: Start static server and ChromeDriver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/origex-http.log 2>&1 &
          echo $! > /tmp/origex-http.pid
          chromedriver --port=9515 --allowed-origins='*' > /tmp/origex-chromedriver.log 2>&1 &
          echo $! > /tmp/origex-chromedriver.pid
          sleep 2

      - name: Run rendered QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg01-rendered
          cat > /tmp/pg01-rendered-qa.py <<'PY'
          import base64
          import json
          import time
          import urllib.request
          from pathlib import Path

          WD = 'http://127.0.0.1:9515'

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(WD + path, data=data, method=method, headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = json.loads(res.read().decode('utf-8'))
              if isinstance(body, dict) and body.get('value') and isinstance(body['value'], dict) and body['value'].get('error'):
                  raise RuntimeError(body['value'])
              return body.get('value') if isinstance(body, dict) else body

          def session(width, height):
              value = request('POST', '/session', {
                  'capabilities': {
                      'alwaysMatch': {
                          'browserName': 'chrome',
                          'goog:chromeOptions': {
                              'args': [
                                  '--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
                                  '--force-device-scale-factor=1', f'--window-size={width},{height}'
                              ]
                          }
                      }
                  }
              })
              sid = value['sessionId'] if 'sessionId' in value else value.get('session_id')
              request('POST', f'/session/{sid}/window/rect', {'width': width, 'height': height, 'x': 0, 'y': 0})
              return sid

          def execute(sid, script, args=None):
              return request('POST', f'/session/{sid}/execute/sync', {'script': script, 'args': args or []})

          def cdp(sid, cmd, params=None):
              return request('POST', f'/session/{sid}/goog/cdp/execute', {'cmd': cmd, 'params': params or {}})

          targets = [
              {'lang': 'ar', 'path': '/ar/', 'dir': 'rtl'},
              {'lang': 'en', 'path': '/en/', 'dir': 'ltr'},
          ]
          viewports = [
              {'name': 'mobile-390', 'width': 390, 'height': 844},
              {'name': 'tablet-820', 'width': 820, 'height': 1180},
              {'name': 'laptop-1366', 'width': 1366, 'height': 900},
              {'name': 'desktop-1536', 'width': 1536, 'height': 960},
          ]

          metric_script = r'''
          const width = arguments[0];
          const expectedDir = arguments[1];
          const doc = document.documentElement;
          const body = document.body;
          const visible = el => {
            const cs = getComputedStyle(el);
            const r = el.getBoundingClientRect();
            return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 0 && r.height > 0 && !el.closest('[aria-hidden="true"]');
          };
          const header = document.querySelector('.orx-site-header');
          const hero = document.querySelector('.orx-hero');
          const h1 = document.querySelector('h1');
          const buttons = [...document.querySelectorAll('.orx-btn')].filter(visible);
          const cards = [...document.querySelectorAll('.orx-card')].filter(visible);
          const offscreen = [...document.querySelectorAll('body *')].filter(el => {
            if (!visible(el)) return false;
            if (getComputedStyle(el).position === 'fixed') return false;
            const r = el.getBoundingClientRect();
            return r.right > width + 1 || r.left < -1;
          }).slice(0, 20).map(el => {
            const r = el.getBoundingClientRect();
            return {tag: el.tagName, cls: typeof el.className === 'string' ? el.className : '', left: Math.round(r.left), right: Math.round(r.right)};
          });
          const buttonRects = buttons.map(b => {
            const r = b.getBoundingClientRect();
            return {text:(b.textContent||'').trim().slice(0,60), width:Math.round(r.width), height:Math.round(r.height)};
          });
          const cardRects = cards.map(c => Math.round(c.getBoundingClientRect().height));
          return {
            lang: doc.lang,
            dir: doc.dir,
            expectedDir,
            scrollWidth: Math.round(doc.scrollWidth),
            clientWidth: Math.round(doc.clientWidth),
            horizontalOverflow: doc.scrollWidth > doc.clientWidth + 1,
            offscreen,
            headerHeight: header ? Math.round(header.getBoundingClientRect().height) : null,
            heroHeight: hero ? Math.round(hero.getBoundingClientRect().height) : null,
            h1FontSize: h1 ? getComputedStyle(h1).fontSize : null,
            h1LineHeight: h1 ? getComputedStyle(h1).lineHeight : null,
            h1Width: h1 ? Math.round(h1.getBoundingClientRect().width) : null,
            minButtonHeight: buttonRects.length ? Math.min(...buttonRects.map(x => x.height)) : null,
            buttonsBelow44: buttonRects.filter(x => x.height < 44),
            cardHeightMin: cardRects.length ? Math.min(...cardRects) : null,
            cardHeightMax: cardRects.length ? Math.max(...cardRects) : null,
            bodyBg: getComputedStyle(body).backgroundColor,
            bodyColor: getComputedStyle(body).color,
            fontsReady: document.fonts ? document.fonts.status : 'unsupported'
          };
          '''

          results = []
          failures = 0
          for target in targets:
              for vp in viewports:
                  sid = session(vp['width'], vp['height'])
                  console_errors = []
                  page_errors = []
                  try:
                      request('POST', f'/session/{sid}/url', {'url': f"http://127.0.0.1:4173{target['path']}"})
                      time.sleep(1.2)
                      execute(sid, "return document.fonts ? document.fonts.ready.then(()=>true) : true;")
                      metrics = execute(sid, metric_script, [vp['width'], target['dir']])
                      min_target = 44 if vp['width'] <= 1024 else 40
                      checks = {
                          'direction': metrics['dir'] == target['dir'],
                          'noHorizontalOverflow': not metrics['horizontalOverflow'] and len(metrics['offscreen']) == 0,
                          'touchTargets': (metrics['minButtonHeight'] or 0) >= min_target,
                          'heroReadable': (metrics['h1Width'] or 0) > 0 and (metrics['heroHeight'] or 0) > 0,
                          'fontsReady': metrics['fontsReady'] in ('loaded', 'unsupported'),
                      }
                      passed = all(checks.values())
                      if not passed:
                          failures += 1

                      layout = cdp(sid, 'Page.getLayoutMetrics')
                      size = layout.get('cssContentSize') or layout.get('contentSize')
                      shot = cdp(sid, 'Page.captureScreenshot', {
                          'format': 'jpeg', 'quality': 42, 'fromSurface': True, 'captureBeyondViewport': True,
                          'clip': {'x': 0, 'y': 0, 'width': size['width'], 'height': size['height'], 'scale': 1}
                      })
                      shot_path = Path(f"qa/pg01-rendered/{target['lang']}-{vp['name']}.jpeg")
                      shot_path.write_bytes(base64.b64decode(shot['data']))

                      results.append({
                          'target': target['lang'], 'viewport': vp, 'minTarget': min_target,
                          'pass': passed, 'checks': checks, 'metrics': metrics,
                          'consoleErrors': console_errors, 'pageErrors': page_errors,
                          'screenshot': str(shot_path)
                      })
                  finally:
                      try:
                          request('DELETE', f'/session/{sid}')
                      except Exception:
                          pass

          report = {'generatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()), 'failures': failures, 'results': results}
          Path('qa/pg01-rendered/report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')

          lines = [
              '# PG01 Rendered QA', '', f"Generated: {report['generatedAt']}", '',
              '| Lang | Viewport | Result | Overflow | Min button | Required | Hero | Fonts |',
              '|---|---:|---|---|---:|---:|---|---|'
          ]
          for r in results:
              lines.append(
                  f"| {r['target'].upper()} | {r['viewport']['width']}×{r['viewport']['height']} | "
                  f"{'PASS' if r['pass'] else 'FAIL'} | {'PASS' if r['checks']['noHorizontalOverflow'] else 'FAIL'} | "
                  f"{r['metrics']['minButtonHeight'] or 'n/a'}px | {r['minTarget']}px | "
                  f"{'PASS' if r['checks']['heroReadable'] else 'FAIL'} | {'PASS' if r['checks']['fontsReady'] else 'FAIL'} |"
              )
          lines += [
              '', '## Notes', '',
              '- Rendered in headless Google Chrome on the GitHub-hosted Ubuntu runner.',
              '- Screenshots are QA evidence and are not buyer-package assets.',
              '- This gate checks rendered layout mechanics; human visual review still controls final C8 approval.', ''
          ]
          Path('qa/pg01-rendered/README.md').write_text('\n'.join(lines), encoding='utf-8')
          raise SystemExit(1 if failures else 0)
          PY
          python3 /tmp/pg01-rendered-qa.py

      - name: Commit QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'orveax-build'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/pg01-rendered
          if git diff --cached --quiet; then
            echo 'No QA evidence changes'
            exit 0
          fi
          git commit -m 'PG01 record rendered visual QA evidence'
          git push origin main
