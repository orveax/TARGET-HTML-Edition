name: PG12 Render Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg12-render-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet selenium
      - name: Diagnose PG12 rendered phase
        run: |
          python - <<'PY'
          import json, subprocess, time, traceback
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait, Select
          out=Path('qa/pg12-suppliers'); out.mkdir(parents=True,exist_ok=True)
          report={'steps':[],'failures':[],'exception':None}
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);time.sleep(1)
          def drv(w=1366):
            o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument(f'--window-size={w},1200');return webdriver.Chrome(options=o)
          try:
            for lang in ('ar','en'):
              for w in (390,820,1366,1536):
                d=drv(w); f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/suppliers.html')
                  WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg12-root]').get_attribute('data-load-state') in ('ready','error'))
                  pg=d.find_element(By.CSS_SELECTOR,'[data-pg12-root]')
                  if pg.get_attribute('data-load-state')!='ready':f.append('data-load')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]'))!=4:f.append('cards')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-featured-supplier-id]'))!=4:f.append('featured')
                  if d.execute_script('return document.documentElement.scrollWidth') > d.execute_script('return document.documentElement.clientWidth')+1:f.append('overflow')
                  if len(d.find_elements(By.CSS_SELECTOR,'a[href^="supplier-details.html?id=supplier-"]'))!=4:f.append('detail-routes')
                  if len(d.find_elements(By.CSS_SELECTOR,'a[href^="products.html?brand=brand-"]'))!=4:f.append('product-routes')
                  small=[]
                  for el in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                    if not el.is_displayed():continue
                    r=el.rect
                    if r['width'] and r['height'] and (r['width']<24 or r['height']<24):small.append((el.tag_name,r['width'],r['height']))
                  if small:f.append(f'touch:{len(small)}')
                  if w>=1051:
                    t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]');t.click();time.sleep(.05)
                    if t.get_attribute('aria-expanded')!='true':f.append('mega-open')
                    t.send_keys(Keys.ESCAPE);time.sleep(.05)
                    if t.get_attribute('aria-expanded')!='false':f.append('mega-close')
                  else:
                    op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]');op.click();time.sleep(.05);dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                    if dr.get_attribute('aria-hidden')!='false':f.append('drawer-open')
                    d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click();time.sleep(.05)
                    if dr.get_attribute('aria-hidden')!='true':f.append('drawer-close')
                finally:d.quit()
                report['steps'].append({'step':f'{lang}-{w}','failures':f});report['failures'] += [f'{lang}-{w}:{x}' for x in f]

            d=drv(); f=[]
            try:
              d.get('http://127.0.0.1:8765/en/suppliers.html');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg12-root]').get_attribute('data-load-state')=='ready')
              s=d.find_element(By.CSS_SELECTOR,'[data-pg12-search]');s.send_keys('NordVale');time.sleep(.08)
              cards=d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]')
              if len(cards)!=1 or cards[0].get_attribute('data-supplier-id')!='supplier-nordvale':f.append('search')
              s.clear();time.sleep(.05);Select(d.find_element(By.CSS_SELECTOR,'[data-pg12-category]')).select_by_value('frozen');time.sleep(.08)
              cards=d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]')
              if len(cards)!=1 or cards[0].get_attribute('data-supplier-id')!='supplier-blueport':f.append('category')
              d.find_element(By.CSS_SELECTOR,'[data-pg12-reset]').click();time.sleep(.08)
              if len(d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]'))!=4:f.append('reset')
              Select(d.find_element(By.CSS_SELECTOR,'[data-pg12-origin]')).select_by_value('IT');time.sleep(.08)
              cards=d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]')
              if len(cards)!=1 or cards[0].get_attribute('data-supplier-id')!='supplier-noura':f.append('origin')
              s=d.find_element(By.CSS_SELECTOR,'[data-pg12-search]');s.send_keys('zzzz-no-match');time.sleep(.08)
              if not d.find_elements(By.CSS_SELECTOR,'.orx-suppliers-empty'):f.append('empty')
            finally:d.quit()
            report['steps'].append({'step':'en-interaction','failures':f});report['failures'] += ['en-int:'+x for x in f]

            d=drv(); f=[]
            try:
              d.get('http://127.0.0.1:8765/ar/suppliers.html?category=dairy&origin=NL');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg12-root]').get_attribute('data-load-state')=='ready')
              cards=d.find_elements(By.CSS_SELECTOR,'[data-supplier-id]')
              if len(cards)!=1 or cards[0].get_attribute('data-supplier-id')!='supplier-nordvale':f.append('deep-result')
              if Select(d.find_element(By.CSS_SELECTOR,'[data-pg12-category]')).first_selected_option.get_attribute('value')!='dairy':f.append('deep-category')
              if Select(d.find_element(By.CSS_SELECTOR,'[data-pg12-origin]')).first_selected_option.get_attribute('value')!='NL':f.append('deep-origin')
            finally:d.quit()
            report['steps'].append({'step':'ar-deep-link','failures':f});report['failures'] += ['ar-deep:'+x for x in f]
          except Exception as e:
            report['exception']={'type':type(e).__name__,'message':str(e),'traceback':traceback.format_exc()[-5000:]}
          finally:server.terminate()
          (out/'diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg12-suppliers/diagnostic.json || true
          git diff --cached --quiet && exit 0
          git commit -m "PG12 record rendered QA diagnostic"
          git push origin main
# trigger current-runtime comprehensive diagnostic
