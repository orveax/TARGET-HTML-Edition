name: PS Lifecycle Tracker Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps-lifecycle-tracker-alignment.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align active repo tracker with canonical PS lifecycle naming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('Content uses C0–C8 from `CONTENT-SYSTEM-V1.md`.','Page lifecycle uses PS0–PS8 from `CONTENT-SYSTEM-V1.md`; `C01–C28` remains reserved for Component IDs.'),
            ('C8 / PASS / CLOSED','PS8 / PASS / CLOSED'),
            ('C7 IMPLEMENTED','PS7 IMPLEMENTED'),
            ('C7 — IMPLEMENTED','PS7 — IMPLEMENTED'),
            ('C8 — CLOSED','PS8 — CLOSED'),
            ('C7 CI PASS','PS7 CI PASS'),
            ('C7 / CI QA PASS','PS7 / CI QA PASS'),
            ('before C8','before PS8'),
            ('pending C8','pending PS8'),
            ('C7 pending','PS7 pending'),
            ('C8 remains','PS8 remains'),
            ('| C0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PS0 | NOT STARTED | NOT STARTED | NOT STARTED |')
          ]
          for old,new in replacements:
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git rm .github/workflows/ps-lifecycle-tracker-alignment.yml
          git commit -m 'Align repo tracker to canonical PS0-PS8 lifecycle naming'
          git pull --rebase origin main
          git push origin HEAD:main
