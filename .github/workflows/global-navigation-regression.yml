name: Global Navigation Regression

# Retriggered after PG25 to reconcile canonical navigation drift.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/**.html'
      - 'en/**.html'
      - 'assets/js/origex-ui.js'
      - '.github/scripts/normalize_global_navigation.py'
      - 'docs/GLOBAL-NAVIGATION-CONTRACT-V1.md'
      - '.github/workflows/global-navigation-regression.yml'

concurrency:
  group: global-navigation-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize canonical standard navigation
        run: python .github/scripts/normalize_global_navigation.py
      - name: Verify canonical standard navigation
        run: python .github/scripts/normalize_global_navigation.py --check
      - name: Verify Landing exception remains explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('ar/landing.html'), Path('en/landing.html')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'data-orx-mega-menu' in text:
                  raise SystemExit(f'{path}: landing must retain compact conversion header without mega menu')
          print('Landing exception PASS')
          PY
      - name: Commit normalized navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar en assets/js/origex-ui.js || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize Global Navigation V1"
          git push origin main
