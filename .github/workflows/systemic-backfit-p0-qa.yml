name: Systemic Backfit P0 QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/css/origex-tokens.css'
      - 'assets/css/origex-foundation.css'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-shell.css'
      - 'assets/js/origex-ui.js'
      - 'ar/components.html'
      - 'en/components.html'
      - '.github/scripts/qa_systemic_backfit_p0.py'
      - '.github/workflows/systemic-backfit-p0-qa.yml'

concurrency:
  group: systemic-backfit-p0-qa
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA dependency
        run: python -m pip install --quiet selenium
      - name: Run SYS-01 through SYS-04 gate
        run: python .github/scripts/qa_systemic_backfit_p0.py
      - name: Commit P0 QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/systemic-backfit-p0 || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record systemic P0 backfit QA evidence"
          git pull --rebase origin main || true
          git push origin main || true
