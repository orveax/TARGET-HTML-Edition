name: PG29 Coming Soon QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'opf/pg29-*'
    paths:
      - 'ar/coming-soon.html'
      - 'en/coming-soon.html'
      - 'assets/css/origex-coming-soon.css'
      - 'assets/js/origex-coming-soon.js'
      - 'assets/js/config.js'
      - 'assets/js/config-engine.js'
      - 'assets/js/origex-ui.js'
      - 'assets/icons/sprite.svg'
      - 'docs/page-design-profiles/pg29-coming-soon-v1.md'
      - '.github/scripts/qa_pg29_coming_soon.py'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg29-coming-soon-qa.yml'

concurrency:
  group: pg29-coming-soon-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG29 source noindex config countdown subscribe social rendered interaction QA
        run: python .github/scripts/qa_pg29_coming_soon.py
      - name: Commit PG29 QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg29-coming-soon || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG29 record Coming Soon QA evidence"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
          exit 1
