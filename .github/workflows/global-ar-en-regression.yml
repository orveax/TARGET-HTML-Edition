name: Global AR EN Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/css/origex-tokens.css'
      - 'assets/css/origex-foundation.css'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-compositions.css'
      - 'assets/css/origex-marketplace-polish.css'
      - 'assets/css/origex-shell.css'
      - 'assets/js/origex-ui.js'
      - 'ar/**.html'
      - 'en/**.html'
      - '.github/scripts/qa_global_ar_en_regression.py'
      - '.github/workflows/global-ar-en-regression.yml'

concurrency:
  group: global-ar-en-regression
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QA dependencies
        run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run all-page AR EN regression
        run: python .github/scripts/qa_global_ar_en_regression.py
      - name: Commit global regression evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/global-ar-en-regression || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record global AR EN regression evidence"
          git pull --rebase origin main || true
          git push origin main || true
