name: PG14 Align Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg14-align-tracker.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align implementation tracker for PG14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('Last Updated: 2026-08-19 — M2 HOME FAMILY IMPLEMENTED / M3 IN PROGRESS / PG05–PG08 C7 CI QA PASS','Last Updated: 2026-08-19 — M2 HOME FAMILY IMPLEMENTED / M3 IN PROGRESS / PG05–PG08 + PG14 C7 CI QA PASS'),
            ('| PG08 Service Details | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + PARENT-NAVIGATION QA PASS |\n| M3 Company Navigation IA | ACTIVE — About + How We Work + Capabilities exposed centrally in shared navigation |','| PG08 Service Details | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + PARENT-NAVIGATION QA PASS |\n| PG14 Market Access | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + MARKET-NAVIGATION QA PASS |\n| M3 Shared Navigation IA | ACTIVE — Home + Company + Market families exposed centrally in shared navigation |'),
            ('| Current Build Baseline | M3 IN PROGRESS — PG05–PG08 CI-complete; PG14 next |','| Current Build Baseline | M3 IN PROGRESS — PG05–PG08 + PG14 CI-complete; PG15 next |'),
            ('├── capabilities.html              # PG07 — C7 CI PASS\n└── service-details.html           # PG08 — C7 CI PASS','├── capabilities.html              # PG07 — C7 CI PASS\n├── service-details.html           # PG08 — C7 CI PASS\n└── market-access.html             # PG14 — C7 CI PASS'),
            ('├── capabilities.html              # PG07 — C7 CI PASS\n└── service-details.html           # PG08 — C7 CI PASS','├── capabilities.html              # PG07 — C7 CI PASS\n├── service-details.html           # PG08 — C7 CI PASS\n└── market-access.html             # PG14 — C7 CI PASS'),
            ('│   ├── origex-service-details.css\n│   └── origex-shell.css','│   ├── origex-service-details.css\n│   ├── origex-market-access.css\n│   └── origex-shell.css'),
            ('├── pg07-capabilities/\n└── pg08-service-details/','├── pg07-capabilities/\n├── pg08-service-details/\n└── pg14-market-access/'),
            ('│   ├── pg07-capabilities-v1.md\n│   └── pg08-service-details-v1.md','│   ├── pg07-capabilities-v1.md\n│   ├── pg08-service-details-v1.md\n│   └── pg14-market-access-v1.md'),
            ('| PG14 | Market Access | C0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PG14 | Market Access | C7 — IMPLEMENTED | APPROVED — `pg14-market-access-v1.md` | `ar/market-access.html` + `en/market-access.html` | SOURCE + RENDERED + MARKET-NAVIGATION QA PASS — CLOUDFLARE BATCH REVIEW PENDING |'),
            ('- PG08 = C7 / CI QA PASS / Cloudflare batch review pending.\n- **Next build: PG14 — Market Access.**','- PG08 = C7 / CI QA PASS / Cloudflare batch review pending.\n- PG14 = C7 / CI QA PASS / Cloudflare batch review pending.\n- **Next build: PG15 — Markets / Countries.**'),
            ('1. Prepare PG14 Content/Design/SEO Contract → C6.\n2. Build `ar/market-access.html` + `en/market-access.html` using the shared system.\n3. Run source/rendered/navigation QA.\n4. Continue PG15 under M3.','1. Prepare PG15 Content/Design/SEO Contract → C6.\n2. Build `ar/markets.html` + `en/markets.html` using the shared system.\n3. Run source/rendered/Market-navigation QA.\n4. Run the M3 Cloudflare batch browser review after PG15.')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected tracker text: {old[:100]}')
            s=s.replace(old,new,1)

          marker='## Cloudflare Test Environment Control'
          section='''### PG14 — Market Access\n- Frozen scope: hero, market-entry model, channel model, fit criteria, route-to-market process, opportunity review and CTA.\n- Profile: `docs/page-design-profiles/pg14-market-access-v1.md`.\n- Arabic: `ar/market-access.html`.\n- English: `en/market-access.html`.\n- Composition: `assets/css/origex-market-access.css`.\n- Shared Market IA: `assets/js/origex-ui.js` now exposes Market Access + Markets in desktop/mobile navigation and applies current state.\n- Source QA: `qa/pg14-market-access/source-report.json` — failures 0.\n- Rendered QA: `qa/pg14-market-access/rendered-report.json` — AR/EN × 390/820/1366/1536 = 8/8 PASS; no overflow; touch targets, direction, seven sections, four entry inputs, five channels, four route steps and three opportunity states PASS.\n- Navigation QA: desktop mega menu + mobile drawer Market family PASS.\n- Final QA status: `qa/pg14-market-access/run-status.txt` — PASS.\n- Evidence commit: `ddddbeaf8fa8c2de852e0532c1d669511732fc0e`.\n- Current: C7 pending Cloudflare M3 batch browser review.\n\n'''
          if '### PG14 — Market Access' not in s:
            s=s.replace(marker,section+marker,1)

          repo_line='Repository: `orveax/origex-html-template`  \n'
          if repo_line not in s:
            s=s.replace('Owner: ORVEAX  \n','Owner: ORVEAX  \n'+repo_line,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git commit -m 'M3 align tracker after PG14 CI QA pass'
          git pull --rebase origin main
          git push origin HEAD:main
