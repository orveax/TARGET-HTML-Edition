name: PG18 RFQ QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/rfq.html'
      - 'en/rfq.html'
      - 'assets/css/origex-rfq.css'
      - 'assets/js/origex-rfq.js'
      - 'assets/data/products.json'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-shell.css'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg18-rfq-v1.md'
      - 'docs/GLOBAL-NAVIGATION-CONTRACT-V1.md'
      - 'docs/GLOBAL-FOOTER-CONTRACT-V1.md'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg18-rfq-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QA dependencies
        run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Source rendered and RFQ interaction QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,subprocess,time,tempfile
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait, Select

          root=Path('.')
          out=root/'qa/pg18-rfq'; out.mkdir(parents=True,exist_ok=True)
          source={'failures':[],'pages':{},'runtime':{},'data':{}}
          expected={
            'ar':{'file':'ar/rfq.html','dir':'rtl','h1':'حوّل احتياج الشراء إلى طلب عرض سعر أوضح.','other':'../en/rfq.html'},
            'en':{'file':'en/rfq.html','dir':'ltr','h1':'Turn your buying requirement into a clearer RFQ.','other':'../ar/rfq.html'}
          }
          sections=['hero','disclosure','form','cta']
          required=['companyName','contactName','email','productId','quantity','quantityUnit','destination','targetTiming','consent']
          products=json.loads((root/'assets/data/products.json').read_text(encoding='utf-8'))
          ids=[p.get('id') for p in products]
          data_fail=[]
          if len(products)!=12: data_fail.append(f'product-count:{len(products)}')
          if len(ids)!=len(set(ids)): data_fail.append('duplicate-product-ids')
          for p in products:
            for k in ('id','nameAr','nameEn','categoryId','originCode','packSizeAr','packSizeEn'):
              if not p.get(k): data_fail.append(f'{p.get("id")}:{k}')
          source['data']={'failures':data_fail,'productCount':len(products)}; source['failures'].extend(data_fail)
          runtime=(root/'assets/js/origex-rfq.js').read_text(encoding='utf-8'); rt=[]
          for forbidden in ('XMLHttpRequest','localStorage','sessionStorage','.post(','method:\'POST\'','method:"POST"'):
            if forbidden in runtime: rt.append(f'forbidden:{forbidden}')
          if 'fetch(productsUrl' not in runtime: rt.append('canonical-product-fetch')
          if '10*1024*1024' not in runtime.replace(' ',''): rt.append('max-size')
          for ext in ('pdf','jpg','jpeg','png','doc','docx'):
            if f"'{ext}'" not in runtime: rt.append(f'file-extension:{ext}')
          if 'event.preventDefault()' not in runtime: rt.append('prevent-submit')
          source['runtime']={'failures':rt}; source['failures'].extend(rt)
          sprite=(root/'assets/icons/sprite.svg').read_text(encoding='utf-8'); sprite_ids=set(re.findall(r'<symbol[^>]+id="([^"]+)"',sprite))
          for lang,cfg in expected.items():
            p=root/cfg['file']; text=p.read_text(encoding='utf-8'); soup=BeautifulSoup(text,'html.parser'); fail=[]
            if soup.html.get('lang')!=lang: fail.append('lang')
            if soup.html.get('dir')!=cfg['dir']: fail.append('dir')
            h1=soup.find_all('h1')
            if len(h1)!=1 or h1[0].get_text(' ',strip=True)!=cfg['h1']: fail.append('h1')
            seen=[n.get('data-pg18-section') for n in soup.select('[data-pg18-section]')]
            if seen!=sections: fail.append(f'sections:{seen}')
            if not soup.select_one('[data-pg18-root][data-products-url="../assets/data/products.json"]'): fail.append('root-data')
            if not soup.find('link',href='../assets/css/origex-rfq.css'): fail.append('css')
            if not soup.find('script',src='../assets/js/origex-rfq.js'): fail.append('runtime')
            allids=[n.get('id') for n in soup.select('[id]') if n.get('id')]
            if len(allids)!=len(set(allids)): fail.append('duplicate-ids')
            if not soup.find('link',rel='canonical'): fail.append('canonical')
            hreflangs={n.get('hreflang') for n in soup.find_all('link',rel='alternate')}
            if not {'ar','en','x-default'}.issubset(hreflangs): fail.append('hreflang')
            if not soup.find('a',href=cfg['other']): fail.append('language-switch')
            form=soup.select_one('form[data-orx-rfq-form]')
            if not form: fail.append('form')
            else:
              for name in required:
                node=form.find(attrs={'name':name})
                if not node or not node.has_attr('required'): fail.append(f'required:{name}')
              file=form.select_one('[data-orx-rfq-file]')
              if not file or file.get('type')!='file': fail.append('file')
              else:
                accept=file.get('accept','')
                for ext in ('.pdf','.jpg','.jpeg','.png','.doc','.docx'):
                  if ext not in accept: fail.append(f'accept:{ext}')
              if not form.select_one('[data-orx-rfq-error][role="alert"]'): fail.append('error-status')
              if not form.select_one('[data-orx-rfq-success][role="status"]'): fail.append('success-status')
            if not soup.select_one('footer[data-orx-global-footer="v1"]'): fail.append('footer')
            if 'TARGET' in text or 'targetft' in text.lower(): fail.append('client-leakage')
            for bad in ('live quotation','price is generated','guaranteed delivery','reserved stock'):
              # only flag affirmative claims; explicit negative boundaries are allowed
              if bad in text.lower() and ('no '+bad not in text.lower()) and ('لا ' not in text): fail.append(f'unsupported:{bad}')
            icons=set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text)); missing=sorted(icons-sprite_ids)
            if missing: fail.append(f'icons:{missing}')
            source['pages'][lang]={'failures':fail,'sections':seen}; source['failures'].extend([f'{lang}:{x}' for x in fail])
          for script,label in [('.github/scripts/normalize_global_navigation.py','global-navigation-drift'),('.github/scripts/normalize_global_footer.py','global-footer-drift')]:
            r=subprocess.run(['python',script,'--check'],capture_output=True,text=True)
            if r.returncode: source['failures'].append(label); source[label]=r.stdout+r.stderr
          (out/'source-report.json').write_text(json.dumps(source,ensure_ascii=False,indent=2),encoding='utf-8')

          rendered={'failures':[],'cases':[],'interaction':{}}
          def drv(width=820):
            o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument(f'--window-size={width},1500'); return webdriver.Chrome(options=o)
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); time.sleep(1)
          try:
            for lang in ('ar','en'):
              for width in (390,820,1366,1536):
                d=None; fail=[]
                try:
                  d=drv(width); d.get(f'http://127.0.0.1:8765/{lang}/rfq.html')
                  WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products') in ('ready','error'))
                  if d.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products')!='ready': fail.append('products-load')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-pg18-section]'))!=4: fail.append('section-count')
                  if d.execute_script('return document.documentElement.scrollWidth')>d.execute_script('return document.documentElement.clientWidth')+1: fail.append('overflow')
                  if d.find_element(By.TAG_NAME,'html').get_attribute('dir')!=('rtl' if lang=='ar' else 'ltr'): fail.append('direction')
                  if len(Select(d.find_element(By.NAME,'productId')).options)!=13: fail.append('product-options')
                  small=[]
                  for el in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                    if not el.is_displayed(): continue
                    r=el.rect
                    if r['width'] and r['height'] and (r['width']<24 or r['height']<24): small.append((el.tag_name,r['width'],r['height']))
                  if small: fail.append(f'touch-targets:{len(small)}')
                  if width>=1051:
                    t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]'); t.click(); time.sleep(.05)
                    if t.get_attribute('aria-expanded')!='true': fail.append('mega-open')
                    t.send_keys(Keys.ESCAPE); time.sleep(.05)
                    if t.get_attribute('aria-expanded')!='false': fail.append('mega-escape')
                  else:
                    op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]'); op.click(); time.sleep(.05); dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                    if dr.get_attribute('aria-hidden')!='false': fail.append('drawer-open')
                    d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click(); time.sleep(.05)
                    if dr.get_attribute('aria-hidden')!='true': fail.append('drawer-close')
                except Exception as e: fail.append(f'exception:{type(e).__name__}:{str(e)[:160]}')
                finally:
                  if d:
                    try:d.quit()
                    except:pass
                rendered['cases'].append({'lang':lang,'width':width,'failures':fail}); rendered['failures'].extend([f'{lang}-{width}:{x}' for x in fail])

            for lang in ('en','ar'):
              d=None; fail=[]
              try:
                d=drv(); d.get(f'http://127.0.0.1:8765/{lang}/rfq.html?product=prod-005')
                WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products')=='ready')
                if d.find_element(By.NAME,'productId').get_attribute('value')!='prod-005': fail.append('query-prefill')
                if not d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-product-summary]').is_displayed(): fail.append('summary')
                langlink=d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href')
                if 'product=prod-005' not in langlink: fail.append('language-preserve')
                # invalid query must not silently fallback
                d.get(f'http://127.0.0.1:8765/{lang}/rfq.html?product=bad-id'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products')=='ready')
                if d.find_element(By.NAME,'productId').get_attribute('value'): fail.append('invalid-fallback')
                if not d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-query-notice]').is_displayed(): fail.append('invalid-notice')
              except Exception as e: fail.append(f'exception:{type(e).__name__}:{str(e)[:160]}')
              finally:
                if d:
                  try:d.quit()
                  except:pass
              rendered['interaction'][f'{lang}-query']=fail; rendered['failures'].extend([f'{lang}-query:{x}' for x in fail])

            for lang in ('en','ar'):
              d=None; fail=[]
              try:
                d=drv(); d.get(f'http://127.0.0.1:8765/{lang}/rfq.html'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products')=='ready')
                submit=d.find_element(By.CSS_SELECTOR,'button[type="submit"]'); d.execute_script("arguments[0].scrollIntoView({block:'center'});",submit); submit.send_keys(Keys.ENTER); time.sleep(.08)
                if d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-success]').is_displayed(): fail.append('empty-success')
                for n,v in {'companyName':'Demo Buyer LLC','contactName':'Demo Buyer','email':'buyer@example.com','quantity':'120','destination':'Doha Port'}.items(): d.find_element(By.NAME,n).send_keys(v)
                Select(d.find_element(By.NAME,'productId')).select_by_index(1); Select(d.find_element(By.NAME,'quantityUnit')).select_by_value('cases'); Select(d.find_element(By.NAME,'targetTiming')).select_by_value('30-days')
                consent=d.find_element(By.NAME,'consent'); d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[0].focus();",consent); consent.send_keys(Keys.SPACE)
                submit=d.find_element(By.CSS_SELECTOR,'button[type="submit"]'); d.execute_script("arguments[0].scrollIntoView({block:'center'});",submit); submit.send_keys(Keys.ENTER); time.sleep(.12)
                if not d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-success]').is_displayed(): fail.append('valid-no-success')
                fetches=d.execute_script("return performance.getEntriesByType('resource').filter(x=>x.initiatorType==='fetch').map(x=>x.name)")
                if any('/assets/data/products.json' not in u for u in fetches): fail.append(f'unexpected-fetch:{fetches}')
              except Exception as e: fail.append(f'exception:{type(e).__name__}:{str(e)[:160]}')
              finally:
                if d:
                  try:d.quit()
                  except:pass
              rendered['interaction'][f'{lang}-validation']=fail; rendered['failures'].extend([f'{lang}-validation:{x}' for x in fail])

            tmp=Path(tempfile.gettempdir()); valid=tmp/'pg18-demo.pdf'; invalid=tmp/'pg18-demo.exe'; valid.write_bytes(b'%PDF-1.4 demo'); invalid.write_bytes(b'demo')
            for lang in ('en','ar'):
              d=None; fail=[]
              try:
                d=drv(); d.get(f'http://127.0.0.1:8765/{lang}/rfq.html'); WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg18-root]').get_attribute('data-pg18-products')=='ready')
                inp=d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-file]'); inp.send_keys(str(invalid)); time.sleep(.08)
                if not d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-error]').is_displayed(): fail.append('invalid-file')
                inp.send_keys(str(valid)); time.sleep(.08)
                if valid.name not in d.find_element(By.CSS_SELECTOR,'[data-orx-rfq-file-name]').text: fail.append('valid-name')
              except Exception as e: fail.append(f'exception:{type(e).__name__}:{str(e)[:160]}')
              finally:
                if d:
                  try:d.quit()
                  except:pass
              rendered['interaction'][f'{lang}-file']=fail; rendered['failures'].extend([f'{lang}-file:{x}' for x in fail])
          finally:
            server.terminate()
          (out/'rendered-report.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2),encoding='utf-8')
          status='PASS' if not source['failures'] and not rendered['failures'] else 'FAIL'; (out/'run-status.txt').write_text(status+'\n',encoding='utf-8')
          print('source',len(source['failures']),'rendered',len(rendered['failures']))
          if status!='PASS': print(source['failures']); print(rendered['failures']); raise SystemExit(1)
          PY
      - name: Commit QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg18-rfq || true
          if git diff --cached --quiet; then exit 0; fi
          git pull --rebase origin main || true
          git push origin main || true
