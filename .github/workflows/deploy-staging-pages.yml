name: Deploy ORIGEX Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - ar/**
      - en/**
      - assets/**
      - .github/workflows/deploy-staging-pages.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: origex-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public staging artifact
        id: prepare
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp -R ar _site/ar
          cp -R en _site/en
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record staging deployment evidence
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p staging
          {
            echo '# ORIGEX Staging Deployment Status'
            echo
            echo "- Head SHA: \`${HEAD_SHA}\`"
            echo "- Workflow run: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
            echo "- Prepare: ${PREPARE_OUTCOME:-not-run}"
            echo "- Configure Pages: ${CONFIGURE_OUTCOME:-not-run}"
            echo "- Upload artifact: ${UPLOAD_OUTCOME:-not-run}"
            echo "- Deploy Pages: ${DEPLOY_OUTCOME:-not-run}"
            if [ -n "${PAGE_URL:-}" ]; then
              echo "- Page URL: ${PAGE_URL}"
            else
              echo '- Page URL: not available'
            fi
          } > staging/deployment-status.md
          git config user.name 'orveax-build'
          git config user.email 'actions@users.noreply.github.com'
          git add staging/deployment-status.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'staging record deployment status'
          git push origin main
