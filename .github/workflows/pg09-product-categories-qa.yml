name: PG09 Product Categories QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/product-categories.html'
      - 'en/product-categories.html'
      - 'assets/css/origex-product-categories.css'
      - 'assets/js/origex-product-categories.js'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg09-product-categories-v1.md'
      - '.github/workflows/pg09-product-categories-qa.yml'

permissions:
  contents: write

concurrency:
  group: pg09-product-categories-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Source contract QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg09-product-categories
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,time,sys

          pages={
            'ar/product-categories.html':{
              'lang':'ar','dir':'rtl',
              'h1':'استعرض المنتجات حسب الفئة التجارية.',
              'canonical':'https://example.com/ar/product-categories.html',
              'disclosure':'كل الفئات والأمثلة التجارية وإشارات التوفر في هذه الصفحة محتوى توضيحي للقالب ويجب استبداله ببيانات أعمال موثقة قبل النشر.'
            },
            'en/product-categories.html':{
              'lang':'en','dir':'ltr',
              'h1':'Explore products by commercial category.',
              'canonical':'https://example.com/en/product-categories.html',
              'disclosure':'All categories, commercial examples and availability references on this page are illustrative template content and must be replaced with verified business data before publication.'
            }
          }
          expected_categories={'ambient','beverages','dairy','frozen','confectionery','ingredients'}
          expected_sections={'hero','category-facts','category-grid','buyer-guidance','cta'}
          sprite=Path('assets/icons/sprite.svg').read_text(encoding='utf-8')
          sprite_ids=set(re.findall(r'<symbol\s+id="([^"]+)"',sprite))

          class P(HTMLParser):
            def __init__(self):
              super().__init__();self.html={};self.h1=[];self.buf=[];self.in_h1=False;self.assets=[];self.ids=[];self.icons=[];self.sections=[];self.categories=[];self.filters=[];self.cards=0
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='html': self.html=d
              if d.get('id'): self.ids.append(d['id'])
              if d.get('data-pg09-section'): self.sections.append(d['data-pg09-section'])
              if d.get('data-category'): self.categories.append(d['data-category']);self.cards+=1
              if d.get('data-category-filter'): self.filters.append(d['data-category-filter'])
              if t=='h1': self.in_h1=True;self.buf=[]
              if t in ('link','script','img'):
                k='href' if t=='link' else 'src'
                if d.get(k): self.assets.append(d[k])
              if t=='use' and d.get('href','').startswith('../assets/icons/sprite.svg#'):
                self.icons.append(d['href'].split('#',1)[1])
            def handle_data(self,d):
              if self.in_h1:self.buf.append(d)
            def handle_endtag(self,t):
              if t=='h1':self.in_h1=False;self.h1.append(''.join(self.buf).strip())

          errors=[];results=[]
          for rel,s in pages.items():
            text=Path(rel).read_text(encoding='utf-8');p=P();p.feed(text)
            missing=sorted(set(p.icons)-sprite_ids)
            checks={
              'languageDirection':p.html.get('lang')==s['lang'] and p.html.get('dir')==s['dir'],
              'singleH1':len(p.h1)==1 and p.h1[0]==s['h1'],
              'canonical':f'rel="canonical" href="{s["canonical"]}"' in text,
              'hreflang':all(x in text for x in ('hreflang="ar"','hreflang="en"','hreflang="x-default"')),
              'openGraph':all(x in text for x in ('og:type','og:site_name','og:title','og:description','og:url','og:image')),
              'structuredData':'BreadcrumbList' in text and 'WebPage' in text,
              'visibleBreadcrumb':'orx-breadcrumb' in text,
              'demoDisclosure':s['disclosure'] in text,
              'fiveCompositionSections':set(p.sections)==expected_sections and len(p.sections)==5,
              'sixCategoryCards':set(p.categories)==expected_categories and p.cards==6,
              'sevenFilterControls':set(p.filters)==expected_categories|{'all'} and len(p.filters)==7,
              'categoryRoutes':all(f'products.html?category={c}' in text for c in expected_categories),
              'categoryCSS':'../assets/css/origex-product-categories.css' in text,
              'categoryRuntime':'../assets/js/origex-product-categories.js' in text,
              'sharedRuntime':'../assets/js/origex-ui.js' in text,
              'staticProductCurrent':'href="product-categories.html" aria-current="page"' in text,
              'uniqueIDs':len(p.ids)==len(set(p.ids)),
              'noClientCDNLeakage':'TARGET' not in text and 'targetft' not in text.lower() and 'cdn.' not in text.lower(),
              'iconReferencesResolve':not missing
            }
            local=[]
            for a in p.assets:
              if a.startswith(('http://','https://','data:','#')): continue
              clean=a.split('?',1)[0].split('#',1)[0]
              if clean:local.append(((Path(rel).parent/clean).resolve()).exists())
            checks['localAssets']=all(local)
            bad=[k for k,v in checks.items() if not v]
            if bad:errors.append(f'{rel}: {bad}; missingIcons={missing}')
            results.append({'page':rel,'checks':checks,'sections':p.sections,'categories':p.categories,'filters':p.filters,'missingIcons':missing,'pass':not bad})
          for req in ('assets/css/origex-product-categories.css','assets/js/origex-product-categories.js','docs/page-design-profiles/pg09-product-categories-v1.md'):
            if not Path(req).exists():errors.append('missing '+req)
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          Path('qa/pg09-product-categories/source-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Start browser QA services
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version | tee qa/pg09-product-categories/browser-baseline.txt
          chromedriver --version | tee -a qa/pg09-product-categories/browser-baseline.txt
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/origex-http.log 2>&1 &
          chromedriver --port=9515 --allowed-origins='*' >/tmp/origex-chromedriver.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/en/product-categories.html >/dev/null
          curl -fsS http://127.0.0.1:9515/status >/dev/null

      - name: Responsive interaction and Product navigation QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,sys
          from pathlib import Path
          WD='http://127.0.0.1:9515';OUT=Path('qa/pg09-product-categories')
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();r=urllib.request.Request(WD+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=30) as f:body=json.loads(f.read().decode())
            return body.get('value') if isinstance(body,dict) else body
          def session(w,h):
            v=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1',f'--window-size={w},{h}']}}}});sid=v['sessionId'];req('POST',f'/session/{sid}/window/rect',{'width':w,'height':h,'x':0,'y':0});return sid
          def js(sid,s,args=None):return req('POST',f'/session/{sid}/execute/sync',{'script':s,'args':args or []})
          pages=[('ar','/ar/product-categories.html','rtl'),('en','/en/product-categories.html','ltr')];views=[(390,844),(820,1180),(1366,900),(1536,960)];results=[];errors=[]
          metric="""const w=arguments[0],doc=document.documentElement;const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!e.closest('[aria-hidden=\"true\"]')};const off=[...document.querySelectorAll('body *')].filter(e=>{if(!vis(e)||getComputedStyle(e).position==='fixed')return false;const r=e.getBoundingClientRect();return r.right>w+1||r.left<-1}).length;const b=[...document.querySelectorAll('button,.orx-btn')].filter(vis).map(e=>e.getBoundingClientRect().height);return{dir:doc.dir,overflow:doc.scrollWidth>doc.clientWidth+1,off,minButton:b.length?Math.min(...b):0,h1:!!document.querySelector('h1'),sections:document.querySelectorAll('[data-pg09-section]').length,cards:document.querySelectorAll('[data-category]').length,filters:document.querySelectorAll('[data-category-filter]').length,visible:[...document.querySelectorAll('[data-category]')].filter(e=>!e.hidden).length};"""
          for lang,path,dirn in pages:
            for w,h in views:
              sid=session(w,h)
              try:
                req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.35);m=js(sid,metric,[w]);required=44 if w<=1024 else 40
                checks={'direction':m['dir']==dirn,'noOverflow':not m['overflow'] and m['off']==0,'touchTargets':m['minButton']>=required,'h1':m['h1'],'fiveSections':m['sections']==5,'sixCards':m['cards']==6,'sevenFilters':m['filters']==7,'allVisible':m['visible']==6}
                if not all(checks.values()):errors.append(f'{lang}-{w}: {checks} {m}')
                results.append({'lang':lang,'viewport':w,'checks':checks,'metrics':m,'pass':all(checks.values())})
              finally:
                try:req('DELETE',f'/session/{sid}')
                except:pass
            sid=session(390,844)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.35)
              filt=js(sid,"""const b=document.querySelector('[data-category-filter=\"beverages\"]');b.click();const one=[...document.querySelectorAll('[data-category]')].filter(e=>!e.hidden);const pressed=b.getAttribute('aria-pressed')==='true';document.querySelector('[data-category-filter=\"all\"]').click();const all=[...document.querySelectorAll('[data-category]')].filter(e=>!e.hidden).length;return one.length===1&&one[0].dataset.category==='beverages'&&pressed&&all===6;""")
              if not filt:errors.append(f'{lang}: category filter interaction')
              bnav=js(sid,"""const o=document.querySelector('[data-orx-drawer-open]');o.click();const d=document.querySelector('[data-orx-mobile-drawer]');const c=d.querySelector('a[data-orx-product-link=\"product-categories.html\"][aria-current=\"page\"]');const p=d.querySelector('a[data-orx-product-link=\"products.html\"]');const ok=d.getAttribute('aria-hidden')==='false'&&c&&p;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return !!ok&&d.getAttribute('aria-hidden')==='true';""")
              if not bnav:errors.append(f'{lang}: mobile Product navigation')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
            sid=session(1366,900)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.35)
              nav=js(sid,"""const t=document.querySelector('[data-orx-mega-trigger]');t.click();const m=document.getElementById(t.getAttribute('aria-controls'));const c=m?.querySelector('a[data-orx-product-link=\"product-categories.html\"][aria-current=\"page\"]');const p=m?.querySelector('a[data-orx-product-link=\"products.html\"]');return !!c&&!!p&&!m.hidden;""")
              if not nav:errors.append(f'{lang}: desktop Product navigation')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          (OUT/'rendered-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8');(OUT/'run-status.txt').write_text('PASS\n' if not errors else 'FAIL\n')
          if errors:print('\n'.join(errors));sys.exit(1)
          PY

      - name: Record QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add qa/pg09-product-categories
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG09 record Product Categories QA evidence'
          git pull --rebase origin main
          git push origin HEAD:main
