name: PG15 Align Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg15-align-tracker.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align implementation tracker after PG15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('Last Updated: 2026-08-19 — M2 HOME FAMILY IMPLEMENTED / M3 IN PROGRESS / PG05–PG08 + PG14 C7 CI QA PASS','Last Updated: 2026-08-19 — M2 HOME FAMILY IMPLEMENTED / M3 CODE+CI COMPLETE / PG05–PG08 + PG14–PG15 C7 CI QA PASS'),
            ('| PG14 Market Access | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + MARKET-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |','| PG14 Market Access | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + MARKET-NAVIGATION QA PASS |\n| PG15 Markets / Countries | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + MARKET-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |'),
            ('| Current Build Baseline | M3 IN PROGRESS — PG05–PG08 + PG14 CI-complete; PG15 next |','| Current Build Baseline | M3 CODE / CI COMPLETE — PG05–PG08 + PG14–PG15; Cloudflare batch review pending |'),
            ('└── market-access.html             # PG14 — C7 CI PASS','├── market-access.html             # PG14 — C7 CI PASS\n└── markets.html                   # PG15 — C7 CI PASS'),
            ('└── market-access.html             # PG14 — C7 CI PASS','├── market-access.html             # PG14 — C7 CI PASS\n└── markets.html                   # PG15 — C7 CI PASS'),
            ('│   ├── origex-market-access.css\n│   └── origex-shell.css','│   ├── origex-market-access.css\n│   ├── origex-markets.css\n│   └── origex-shell.css'),
            ('│   ├── origex-ui.js\n│   └── origex-landing.js','│   ├── origex-ui.js\n│   ├── origex-markets.js\n│   └── origex-landing.js'),
            ('├── pg08-service-details/\n└── pg14-market-access/','├── pg08-service-details/\n├── pg14-market-access/\n└── pg15-markets/'),
            ('│   ├── pg08-service-details-v1.md\n│   └── pg14-market-access-v1.md','│   ├── pg08-service-details-v1.md\n│   ├── pg14-market-access-v1.md\n│   └── pg15-markets-v1.md'),
            ('| PG15 | Markets / Countries | C0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PG15 | Markets / Countries | C7 — IMPLEMENTED | APPROVED — `pg15-markets-v1.md` | `ar/markets.html` + `en/markets.html` | SOURCE + RENDERED + FILTER + MARKET-NAVIGATION QA PASS — CLOUDFLARE BATCH REVIEW PENDING |'),
            ('- PG14 = C7 / CI QA PASS / Cloudflare batch review pending.\n- **Next build: PG15 — Markets / Countries.**','- PG14 = C7 / CI QA PASS / Cloudflare batch review pending.\n- PG15 = C7 / CI QA PASS / Cloudflare batch review pending.\n- **M3 page production = CODE / CI COMPLETE. Next gate: Cloudflare M3 batch browser review.**'),
            ('1. Prepare PG15 Content/Design/SEO Contract → C6.\n2. Build `ar/markets.html` + `en/markets.html` using the shared system.\n3. Run source/rendered/Market-navigation QA.\n4. Run the M3 Cloudflare batch browser review after PG15.','1. Run Cloudflare batch browser review for PG05–PG08 + PG14–PG15.\n2. Fix deployment-only defects if any and rerun the affected page QA.\n3. Promote eligible M3 pages to C8 only after deployed-browser acceptance.\n4. Open M4 page production after the M3 batch deployment gate.')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected tracker text: {old[:110]}')
            s=s.replace(old,new,1)
          marker='## Cloudflare Test Environment Control'
          section='''### PG15 — Markets / Countries\n- Frozen scope: region/country filters, country cards, schematic market map, channel tags, market overview and CTA.\n- Profile: `docs/page-design-profiles/pg15-markets-v1.md`.\n- Arabic: `ar/markets.html`.\n- English: `en/markets.html`.\n- Composition: `assets/css/origex-markets.css`.\n- Filter runtime: `assets/js/origex-markets.js` — minimal vanilla JS; no external map/data API.\n- Canonical demo markets: Qatar, Saudi Arabia, UAE, Kuwait, Bahrain and Oman. Commercial/channel notes are illustrative only and require verified replacement.\n- Source QA: `qa/pg15-markets/source-report.json` — failures 0.\n- Rendered QA: `qa/pg15-markets/rendered-report.json` — AR/EN × 390/820/1366/1536 = 8/8 PASS; no overflow; touch targets, direction, 6 sections, 6 country cards, 18 channel tags and 6 map nodes PASS.\n- Interaction QA: country filtering and reset PASS; desktop/mobile Market current-state PASS.\n- Final QA status: `qa/pg15-markets/run-status.txt` — PASS.\n- Current: C7 pending Cloudflare M3 batch browser review. M3 page production is code/CI complete.\n\n'''
          if '### PG15 — Markets / Countries' not in s:
            s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git commit -m 'M3 align tracker after PG15 CI QA pass'
          git pull --rebase origin main
          git push origin HEAD:main
