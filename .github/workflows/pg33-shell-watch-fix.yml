name: PG33 Shell Watch Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg33-shell-watch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared shell to PG33 QA watch paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pg33-company-profile-qa.yml')
          s = p.read_text(encoding='utf-8')
          needle = "      - 'assets/css/origex-company-profile.css'\n"
          addition = needle + "      - 'assets/css/origex-shell.css'\n"
          if "      - 'assets/css/origex-shell.css'\n" not in s:
              s = s.replace(needle, addition)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit permanent QA contract and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pg33-shell-watch-fix.yml
          git add .github/workflows/pg33-company-profile-qa.yml
          git commit -m "ci: make PG33 QA watch shared shell changes"
          git push origin main
