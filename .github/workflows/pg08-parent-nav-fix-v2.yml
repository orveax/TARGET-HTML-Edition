name: PG08 Parent Navigation Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg08-parent-nav-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve Capabilities parent state for Service Details
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/origex-ui.js')
          s=p.read_text(encoding='utf-8')
          marker='const hydrateCompanyNavigation = () => {'
          head,tail=s.split(marker,1)
          if "const activeCompanyFile = currentFile === 'service-details.html' ? 'capabilities.html' : currentFile;" not in tail:
              tail=tail.replace("    const currentFile = window.location.pathname.split('/').pop() || 'index.html';\n    const companyFiles = new Set(['about.html', 'how-we-work.html', 'capabilities.html']);","    const currentFile = window.location.pathname.split('/').pop() || 'index.html';\n    const activeCompanyFile = currentFile === 'service-details.html' ? 'capabilities.html' : currentFile;\n    const companyFiles = new Set(['about.html', 'how-we-work.html', 'capabilities.html']);",1)
              tail=tail.replace("if (href === currentFile) link.setAttribute('aria-current', 'page');","if (href === activeCompanyFile) link.setAttribute('aria-current', 'page');",2)
          p.write_text(head+marker+tail,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/origex-ui.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG08 preserve Capabilities parent navigation state'
          git pull --rebase origin main
          git push origin HEAD:main
