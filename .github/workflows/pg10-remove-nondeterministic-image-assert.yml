name: PG10 Remove Nondeterministic Lazy Image Assert

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg10-remove-nondeterministic-image-assert.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove headless lazy-image assertion only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pg10-products-rendered-qa.yml')
          s=p.read_text(encoding='utf-8')
          old=",'firstVisibleImageLoaded':m['firstImageLoaded']"
          if old not in s:
              raise SystemExit('lazy image assertion marker missing')
          s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pg10-products-rendered-qa.yml
          git rm .github/workflows/pg10-remove-nondeterministic-image-assert.yml
          git commit -m 'PG10 remove nondeterministic headless lazy-image assertion'
          git pull --rebase origin main
          git push origin HEAD:main
