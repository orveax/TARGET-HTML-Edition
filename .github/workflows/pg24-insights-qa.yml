name: PG24 Insights QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/insights.html'
      - 'en/insights.html'
      - 'assets/css/origex-insights.css'
      - 'assets/js/origex-insights.js'
      - 'docs/page-design-profiles/pg24-insights-v1.md'
      - 'assets/css/origex-components.css'
      - 'assets/css/origex-shell.css'
      - 'assets/icons/sprite.svg'
      - 'assets/js/origex-ui.js'
      - '.github/scripts/normalize_global_navigation.py'
      - '.github/scripts/normalize_global_footer.py'
      - '.github/workflows/pg24-insights-qa.yml'

concurrency:
  group: pg24-insights-qa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Run PG24 source editorial runtime rendered interaction QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json,re,subprocess,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          R=Path('.');O=R/'qa/pg24-insights';O.mkdir(parents=True,exist_ok=True)
          source={'failures':[],'pages':{},'runtime':{}}
          js=(R/'assets/js/origex-insights.js').read_text(encoding='utf-8');rf=[]
          for bad in ('fetch(','XMLHttpRequest','localStorage','sessionStorage'):
            if bad in js:rf.append('forbidden-runtime:'+bad)
          for required in ('history.replaceState','aria-pressed','pg24Ready','pg24Visible','pg24Page'):
            if required not in js:rf.append('runtime-missing:'+required)
          source['runtime']={'failures':rf};source['failures']+=rf
          sprite=(R/'assets/icons/sprite.svg').read_text(encoding='utf-8');sprite_ids=set(re.findall(r'<symbol[^>]+id="([^"]+)"',sprite))
          specs={
            'ar':('rtl','رؤى عملية حول المنتج والسوق والتوزيع.','../en/insights.html'),
            'en':('ltr','Practical insights on products, markets and distribution.','../ar/insights.html')
          }
          expected_sections=['hero','featured','library','guidance','cta'];expected_categories=['all','buying','product','market','distribution','supplier']
          for lang,(direction,h1,other) in specs.items():
            text=(R/lang/'insights.html').read_text(encoding='utf-8');s=BeautifulSoup(text,'html.parser');f=[]
            if s.html.get('lang')!=lang or s.html.get('dir')!=direction:f.append('lang-dir')
            hs=s.find_all('h1')
            if len(hs)!=1 or hs[0].get_text(' ',strip=True)!=h1:f.append('h1')
            sections=[n.get('data-pg24-section') for n in s.select('[data-pg24-section]')]
            if sections!=expected_sections:f.append('sections:'+str(sections))
            if len(s.select('.orx-featured-article'))!=1:f.append('featured-count')
            cards=s.select('[data-orx-article-card]')
            if len(cards)!=8:f.append('grid-count:'+str(len(cards)))
            cats=[b.get('data-orx-insights-filter') for b in s.select('[data-orx-insights-filter]')]
            if cats!=expected_categories:f.append('categories:'+str(cats))
            ids=[]
            for a in s.select('a[href^="article-details.html?id=article-"]'):
              m=re.search(r'id=(article-\d{3})',a.get('href',''))
              if m:ids.append(m.group(1))
            if ids!=[f'article-{i:03d}' for i in range(1,10)]:f.append('article-route-ids:'+str(ids))
            if not s.select_one('[data-orx-insights-search]'):f.append('search')
            if not s.select_one('[data-orx-insights-count]'):f.append('count')
            if not s.select_one('[data-orx-insights-empty][hidden]'):f.append('empty')
            if not s.select_one('[data-orx-insights-pages]'):f.append('pagination')
            combined=s.get_text(' ',strip=True).lower()
            if 'demo' not in combined:f.append('demo-boundary')
            if 'TARGET' in text or 'targetft' in text.lower():f.append('client-leak')
            if any(x in combined for x in ('guaranteed result','guaranteed roi','مضمون 100%')):f.append('inflated-claim')
            if not s.find('a',href=other):f.append('language-switch')
            if not s.select_one('[data-orx-mega-trigger][aria-current="page"]'):f.append('explore-current')
            if not s.select_one('.orx-mega-menu a[href="insights.html"][aria-current="page"]'):f.append('mega-current')
            if not s.select_one('.orx-mobile-nav a[href="insights.html"][aria-current="page"]'):f.append('mobile-current')
            if not s.select_one('footer[data-orx-global-footer="v1"] [data-orx-business-hours]'):f.append('footer')
            canonical=s.find('link',rel='canonical')
            if not canonical or canonical.get('href')!=f'https://example.com/{lang}/insights.html':f.append('canonical')
            hreflangs={n.get('hreflang') for n in s.find_all('link',rel='alternate')}
            if not {'ar','en','x-default'}.issubset(hreflangs):f.append('hreflang')
            try:
              data=json.loads(s.find('script',attrs={'type':'application/ld+json'}).string);types={x.get('@type') for x in data.get('@graph',[])}
              if not {'CollectionPage','BreadcrumbList'}.issubset(types):f.append('schema')
              if types & {'Article','NewsArticle','Product','Offer','Review','Rating','AggregateRating'}:f.append('prohibited-schema:'+str(sorted(types)))
            except Exception:f.append('schema-json')
            icons=set(re.findall(r'sprite\.svg#([a-z0-9-]+)',text));missing=sorted(icons-sprite_ids)
            if missing:f.append('icons:'+str(missing))
            source['pages'][lang]={'failures':f,'sections':sections,'articleCount':len(cards)};source['failures'] += [lang+':'+x for x in f]
          for script,label in [('.github/scripts/normalize_global_navigation.py','nav-drift'),('.github/scripts/normalize_global_footer.py','footer-drift')]:
            r=subprocess.run(['python',script,'--check'],capture_output=True,text=True)
            if r.returncode:source['failures'].append(label);source[label]=r.stdout+r.stderr
          (O/'source-report.json').write_text(json.dumps(source,ensure_ascii=False,indent=2),encoding='utf-8')

          rendered={'failures':[],'cases':[],'interaction':{}}
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--window-size=820,1800')
          srv=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);time.sleep(1)
          try:
            for lang in ('ar','en'):
              d=webdriver.Chrome(options=opts)
              try:
                for w in (390,820,1366,1536):
                  f=[]
                  try:
                    d.set_window_size(w,1800);d.get(f'http://127.0.0.1:8765/{lang}/insights.html')
                    WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-ready')=='true')
                    if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-article-card]:not([hidden])'))!=6:f.append('page1-visible')
                    if d.find_element(By.CSS_SELECTOR,'[data-orx-insights-count]').text!='8':f.append('count')
                    if d.execute_script('return document.documentElement.scrollWidth')>d.execute_script('return document.documentElement.clientWidth')+1:f.append('overflow')
                    if d.find_element(By.TAG_NAME,'html').get_attribute('dir')!=('rtl' if lang=='ar' else 'ltr'):f.append('direction')
                    small=[]
                    for e in d.find_elements(By.CSS_SELECTOR,'a,button,input,select'):
                      if e.is_displayed() and e.rect['width'] and e.rect['height'] and (e.rect['width']<24 or e.rect['height']<24):small.append({'tag':e.tag_name,'w':round(e.rect['width'],1),'h':round(e.rect['height'],1),'text':e.text[:24]})
                    if small:f.append('touch:'+json.dumps(small,ensure_ascii=False))
                    if w>=1051:
                      t=d.find_element(By.CSS_SELECTOR,'[data-orx-mega-trigger]');t.click();time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='true':f.append('mega-open')
                      t.send_keys(Keys.ESCAPE);time.sleep(.04)
                      if t.get_attribute('aria-expanded')!='false':f.append('mega-escape')
                    else:
                      op=d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-open]');op.click();time.sleep(.04);dr=d.find_element(By.CSS_SELECTOR,'[data-orx-mobile-drawer]')
                      if dr.get_attribute('aria-hidden')!='false':f.append('drawer-open')
                      d.find_element(By.CSS_SELECTOR,'[data-orx-drawer-close]').click();time.sleep(.04)
                      if dr.get_attribute('aria-hidden')!='true':f.append('drawer-close')
                  except Exception as e:f.append(type(e).__name__+':'+str(e)[:160])
                  rendered['cases'].append({'lang':lang,'width':w,'failures':f});rendered['failures'] += [f'{lang}-{w}:{x}' for x in f]

                f=[]
                try:
                  d.set_window_size(820,1800);d.get(f'http://127.0.0.1:8765/{lang}/insights.html?category=product&page=1')
                  WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-ready')=='true')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-article-card]:not([hidden])'))!=2:f.append('product-visible')
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-insights-count]').text!='2':f.append('product-count')
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-insights-filter="product"]').get_attribute('aria-pressed')!='true':f.append('product-active')
                  if 'category=product' not in d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href'):f.append('language-category')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:160])
                rendered['interaction'][lang+'-category']=f;rendered['failures'] += [lang+'-category:'+x for x in f]

                f=[]
                try:
                  term='مورد' if lang=='ar' else 'supplier'
                  d.get(f'http://127.0.0.1:8765/{lang}/insights.html');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-ready')=='true')
                  q=d.find_element(By.CSS_SELECTOR,'[data-orx-insights-search]');q.clear();q.send_keys(term);time.sleep(.25)
                  visible=len(d.find_elements(By.CSS_SELECTOR,'[data-orx-article-card]:not([hidden])'))
                  if visible<1 or visible>=8:f.append('search-visible:'+str(visible))
                  if 'q=' not in d.current_url:f.append('search-query')
                  if 'q=' not in d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href'):f.append('language-search')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:160])
                rendered['interaction'][lang+'-search']=f;rendered['failures'] += [lang+'-search:'+x for x in f]

                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/insights.html?page=2');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-ready')=='true')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-article-card]:not([hidden])'))!=2:f.append('page2-visible')
                  if d.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-page')!='2':f.append('page2-state')
                  current=d.find_element(By.CSS_SELECTOR,'[data-orx-insights-pages] [aria-current="page"]')
                  if current.text!='2':f.append('page2-current')
                  if 'page=2' not in d.find_element(By.CSS_SELECTOR,'.orx-lang-switch').get_attribute('href'):f.append('language-page')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:160])
                rendered['interaction'][lang+'-pagination']=f;rendered['failures'] += [lang+'-pagination:'+x for x in f]

                f=[]
                try:
                  d.get(f'http://127.0.0.1:8765/{lang}/insights.html?q=zzzz-not-found');WebDriverWait(d,8).until(lambda x:x.find_element(By.CSS_SELECTOR,'[data-pg24-root]').get_attribute('data-pg24-ready')=='true')
                  if len(d.find_elements(By.CSS_SELECTOR,'[data-orx-article-card]:not([hidden])'))!=0:f.append('empty-visible')
                  if not d.find_element(By.CSS_SELECTOR,'[data-orx-insights-empty]').is_displayed():f.append('empty-hidden')
                  if d.find_element(By.CSS_SELECTOR,'[data-orx-insights-count]').text!='0':f.append('empty-count')
                except Exception as e:f.append(type(e).__name__+':'+str(e)[:160])
                rendered['interaction'][lang+'-empty']=f;rendered['failures'] += [lang+'-empty:'+x for x in f]
              finally:d.quit()
          finally:srv.terminate()
          (O/'rendered-report.json').write_text(json.dumps(rendered,ensure_ascii=False,indent=2),encoding='utf-8')
          status='PASS' if not source['failures'] and not rendered['failures'] else 'FAIL';(O/'run-status.txt').write_text(status+'\n',encoding='utf-8')
          print(status);print(source['failures']);print(rendered['failures'])
          if status!='PASS':raise SystemExit(1)
          PY
      - name: Commit PG24 evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/pg24-insights || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "PG24 record Insights QA evidence"
          git pull --rebase origin main || true
          git push origin main || true
