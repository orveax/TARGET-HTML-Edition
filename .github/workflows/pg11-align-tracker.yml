name: PG11 Align Implementation Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg11-align-tracker.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align PG11 tracker state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'Last Updated: .*',
              'Last Updated: 2026-08-19 — GLOBAL NAV V1 LOCKED / V1 = 33 LAYOUTS / PG09–PG11 PS7 CI QA PASS / PG12 NEXT',
              s,
              count=1,
          )

          if '| PG11 Product Details |' not in s:
              anchor = '| PG10 Products Grid | PS7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED + SEARCH/FILTER/PAGINATION + PRODUCT-NAVIGATION QA PASS |\n'
              row = '| PG11 Product Details | PS7 IMPLEMENTED — AR+EN — DATA + SOURCE + RENDERED 8/8 + PRODUCT SWITCH + SUPPLIER RELATION + RESOURCE PLACEHOLDERS + RELATED PRODUCTS + RFQ + PRODUCT-NAVIGATION QA PASS |\n'
              s = s.replace(anchor, anchor + row)

          s = re.sub(
              r'\| Current Build Baseline \|.*\|',
              '| Current Build Baseline | Global Navigation V1 locked. M4 IN PROGRESS — PG09–PG11 PS7 CI PASS; PG12 Suppliers / Brands Directory next. PG33 Company Profile remains a parallel M3 QA follow-up. |',
              s,
              count=1,
          )
          s = re.sub(
              r'\| M4 Product / Supplier / Conversion \| IN PROGRESS \|.*\|',
              '| M4 Product / Supplier / Conversion | IN PROGRESS | PG09–PG11 PS7 CI PASS; PG12–PG13 + PG16–PG19 remain |',
              s,
              count=1,
          )

          # Active implementation trees.
          for marker in (
              '├── products.html                  # PG10 — PS7 CI PASS\n',
              '├── products.html                  # PG10 — PS7 CI PASS\r\n',
          ):
              if marker in s and 'product-details.html           # PG11 — PS7 CI PASS' not in s:
                  s = s.replace(marker, marker + '├── product-details.html           # PG11 — PS7 CI PASS\n', 1)
                  break
          # Add EN tree separately if only one was inserted.
          occurrences = s.count('product-details.html           # PG11 — PS7 CI PASS')
          if occurrences < 2:
              target = '├── products.html                  # PG10 — PS7 CI PASS\n'
              pos = s.find(target, s.find('en/'))
              if pos != -1:
                  end = pos + len(target)
                  s = s[:end] + '├── product-details.html           # PG11 — PS7 CI PASS\n' + s[end:]

          if '│   ├── origex-product-details.css' not in s:
              s = s.replace('│   ├── origex-products.css\n', '│   ├── origex-products.css\n│   ├── origex-product-details.css\n', 1)
          if '│   ├── origex-product-details.js' not in s:
              s = s.replace('│   ├── origex-products.js\n', '│   ├── origex-products.js\n│   ├── origex-product-details.js\n', 1)
          if '├── pg11-product-details/' not in s:
              s = s.replace('├── pg10-products/\n', '├── pg10-products/\n├── pg11-product-details/\n', 1)
          if '│   ├── pg11-product-details-v1.md' not in s:
              s = s.replace('│   ├── pg10-products-grid-v1.md\n', '│   ├── pg10-products-grid-v1.md\n│   ├── pg11-product-details-v1.md\n', 1)

          s = re.sub(
              r'\| PG11 \| Product Details \| PS0 \| NOT STARTED \| NOT STARTED \| NOT STARTED \|',
              '| PG11 | Product Details | PS7 — IMPLEMENTED | APPROVED — `pg11-product-details-v1.md` | `ar/product-details.html` + `en/product-details.html` | DATA + SOURCE + RENDERED 8/8 + PRODUCT SWITCH + SUPPLIER RELATION + RESOURCE PLACEHOLDER + RELATED PRODUCTS + RFQ + PRODUCT-NAVIGATION QA PASS — CLOUDFLARE M4 BATCH REVIEW PENDING |',
              s,
              count=1,
          )

          # Broader current-state wording that may remain in prose.
          s = s.replace('PG09–PG10 PS7 CI PASS; PG11 next', 'PG09–PG11 PS7 CI PASS; PG12 next')
          s = s.replace('PG11 Product Details is next', 'PG12 Suppliers / Brands Directory is next')

          evidence = '''\n## PG11 Evidence — Product Details\n\n- PS6 contract: `docs/page-design-profiles/pg11-product-details-v1.md`.\n- AR/EN: `ar/product-details.html` + `en/product-details.html`.\n- Composition/runtime: `assets/css/origex-product-details.css` + `assets/js/origex-product-details.js`.\n- Data authority: `assets/data/products.json` + `assets/data/suppliers.json`; default `prod-001`, reusable `?id=<product-id>` switching.\n- Source/data QA: `qa/pg11-product-details/source-report.json` — failures 0.\n- Rendered/interaction QA: `qa/pg11-product-details/rendered-report.json` — failures 0; AR/EN × 390/820/1366/1536 = 8/8 PASS.\n- `prod-005` switch, supplier/media/RFQ/schema update, language query preservation and invalid-ID fallback PASS.\n- First run identified a shared breadcrumb touch-target defect; fixed centrally in `assets/css/origex-components.css` (`e7bcf047f58156c3210dbb2abd5a517625a5a649`), then rerun PASS.\n- Final QA evidence: `qa/pg11-product-details/run-status.txt` = PASS; commit `695b2f0e610c7115a61e382077c84d3b417c26a2`.\n- Closure record: `docs/PG11-PRODUCT-DETAILS-QA-2026-08-19.md`.\n- Current: PS7 pending Cloudflare M4 batch browser acceptance before PS8. PG12 is next.\n'''
          if '## PG11 Evidence — Product Details' not in s:
              s = s.rstrip() + '\n' + evidence

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit tracker alignment and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pg11-align-tracker.yml
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git commit -m "docs: align tracker with PG11 PS7 closure"
          git push origin main
