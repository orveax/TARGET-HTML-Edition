name: PG15 Markets Countries QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ar/markets.html'
      - 'en/markets.html'
      - 'assets/css/origex-markets.css'
      - 'assets/js/origex-markets.js'
      - 'assets/js/origex-ui.js'
      - 'docs/page-design-profiles/pg15-markets-v1.md'
      - '.github/workflows/pg15-markets-qa.yml'

permissions:
  contents: write

concurrency:
  group: pg15-markets-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Source contract QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/pg15-markets
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,time,sys

          pages={
            'ar/markets.html':{'lang':'ar','dir':'rtl','h1':'أسواق مختلفة تحتاج مسارات توزيع مختلفة.','canonical':'https://example.com/ar/markets.html','disclosure':'معلومات السوق في هذه الصفحة توضيحية ضمن القالب ويجب استبدالها ببيانات موثقة قبل النشر.'},
            'en/markets.html':{'lang':'en','dir':'ltr','h1':'Different markets require different distribution routes.','canonical':'https://example.com/en/markets.html','disclosure':'Market information on this page is illustrative template content and must be replaced with verified data before publication.'}
          }
          expected_countries={'qatar','saudi','uae','kuwait','bahrain','oman'}
          expected_sections={'hero','market-overview','filters','market-map','country-cards','cta'}
          sprite=Path('assets/icons/sprite.svg').read_text(encoding='utf-8')
          sprite_ids=set(re.findall(r'<symbol\s+id="([^"]+)"',sprite))

          class P(HTMLParser):
            def __init__(self):
              super().__init__();self.html={};self.h1=[];self.buf=[];self.in_h1=False;self.assets=[];self.ids=[];self.icons=[];self.sections=[];self.cards=[];self.tags=0;self.filters=0;self.map_nodes=0
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='html': self.html=d
              if d.get('id'): self.ids.append(d['id'])
              if d.get('data-pg15-section'): self.sections.append(d['data-pg15-section'])
              if t=='h1': self.in_h1=True;self.buf=[]
              cls=d.get('class','').split()
              if 'orx-country-card' in cls and d.get('data-country'): self.cards.append(d.get('data-country'))
              if 'orx-country-card__tag' in cls: self.tags+=1
              if d.get('data-orx-country-filter') is not None: self.filters+=1
              if 'orx-market-map__node' in cls: self.map_nodes+=1
              if t in ('link','script','img'):
                k='href' if t=='link' else 'src'
                if d.get(k): self.assets.append(d[k])
              if t=='use' and d.get('href','').startswith('../assets/icons/sprite.svg#'): self.icons.append(d['href'].split('#',1)[1])
            def handle_data(self,d):
              if self.in_h1:self.buf.append(d)
            def handle_endtag(self,t):
              if t=='h1': self.in_h1=False;self.h1.append(''.join(self.buf).strip())

          errors=[];results=[]
          for rel,s in pages.items():
            text=Path(rel).read_text(encoding='utf-8');p=P();p.feed(text);missing=sorted(set(p.icons)-sprite_ids)
            checks={
              'languageDirection':p.html.get('lang')==s['lang'] and p.html.get('dir')==s['dir'],
              'singleH1':len(p.h1)==1 and p.h1[0]==s['h1'],
              'canonical':f'rel="canonical" href="{s["canonical"]}"' in text,
              'hreflang':all(x in text for x in ('hreflang="ar"','hreflang="en"','hreflang="x-default"')),
              'openGraph':all(x in text for x in ('og:type','og:site_name','og:title','og:description','og:url','og:image')),
              'structuredData':'BreadcrumbList' in text and 'WebPage' in text,
              'visibleBreadcrumb':'orx-breadcrumb' in text,
              'demoDisclosure':s['disclosure'] in text,
              'sixFrozenSections':set(p.sections)==expected_sections and len(p.sections)==6,
              'sixCountryCards':set(p.cards)==expected_countries and len(p.cards)==6,
              'channelTags':p.tags>=18,
              'countryFilters':p.filters==7,
              'regionFilter':'data-orx-region-filter' in text,
              'marketMap':p.map_nodes==6 and 'orx-market-map__core' in text,
              'filterRuntime':'../assets/js/origex-markets.js' in text,
              'marketsCSS':'../assets/css/origex-markets.css' in text,
              'sharedRuntime':'../assets/js/origex-ui.js' in text,
              'staticMarketCurrent':'href="markets.html" aria-current="page"' in text,
              'uniqueIDs':len(p.ids)==len(set(p.ids)),
              'noClientCDNLeakage':'TARGET' not in text and 'targetft' not in text.lower() and 'cdn.' not in text.lower(),
              'iconReferencesResolve':not missing
            }
            local=[]
            for a in p.assets:
              if a.startswith(('http://','https://','data:','#')): continue
              clean=a.split('?',1)[0].split('#',1)[0]
              if clean: local.append(((Path(rel).parent/clean).resolve()).exists())
            checks['localAssets']=all(local)
            bad=[k for k,v in checks.items() if not v]
            if bad: errors.append(f'{rel}: {bad}; missing icons={missing}; sections={p.sections}; cards={p.cards}; tags={p.tags}; filters={p.filters}; mapNodes={p.map_nodes}')
            results.append({'page':rel,'checks':checks,'missingIcons':missing,'sections':p.sections,'countries':p.cards,'channelTags':p.tags,'filters':p.filters,'mapNodes':p.map_nodes,'pass':not bad})

          for req in ('assets/css/origex-markets.css','assets/js/origex-markets.js','docs/page-design-profiles/pg15-markets-v1.md'):
            if not Path(req).exists(): errors.append('missing '+req)
          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors}
          Path('qa/pg15-markets/source-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          if errors: print('\n'.join(errors));sys.exit(1)
          PY

      - name: Start browser QA services
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version | tee qa/pg15-markets/browser-baseline.txt
          chromedriver --version | tee -a qa/pg15-markets/browser-baseline.txt
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/origex-http.log 2>&1 &
          chromedriver --port=9515 --allowed-origins='*' >/tmp/origex-chromedriver.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/ar/markets.html >/dev/null
          curl -fsS http://127.0.0.1:9515/status >/dev/null

      - name: Rendered responsive filter and Market navigation QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,sys
          from pathlib import Path
          WD='http://127.0.0.1:9515';OUT=Path('qa/pg15-markets')
          def req(method,path,payload=None):
            data=None if payload is None else json.dumps(payload).encode();r=urllib.request.Request(WD+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=30) as f: body=json.loads(f.read().decode())
            return body.get('value') if isinstance(body,dict) else body
          def session(w,h):
            v=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--force-device-scale-factor=1',f'--window-size={w},{h}']}}}});sid=v['sessionId'];req('POST',f'/session/{sid}/window/rect',{'width':w,'height':h,'x':0,'y':0});return sid
          def js(sid,s,args=None): return req('POST',f'/session/{sid}/execute/sync',{'script':s,'args':args or []})

          pages=[('ar','/ar/markets.html','rtl'),('en','/en/markets.html','ltr')];views=[(390,844),(820,1180),(1366,900),(1536,960)];results=[];errors=[]
          metric="""const w=arguments[0],doc=document.documentElement;const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0&&!e.closest('[aria-hidden=\"true\"]')};const off=[...document.querySelectorAll('body *')].filter(e=>{if(!vis(e)||getComputedStyle(e).position==='fixed')return false;const r=e.getBoundingClientRect();return r.right>w+1||r.left<-1}).length;const b=[...document.querySelectorAll('.orx-btn,.orx-market-filter-chip')].filter(vis).map(e=>e.getBoundingClientRect().height);return{dir:doc.dir,overflow:doc.scrollWidth>doc.clientWidth+1,off,minButton:b.length?Math.min(...b):0,h1:!!document.querySelector('h1'),sections:document.querySelectorAll('[data-pg15-section]').length,cards:document.querySelectorAll('[data-orx-market-card]').length,visibleCards:[...document.querySelectorAll('[data-orx-market-card]')].filter(e=>!e.hidden).length,tags:document.querySelectorAll('.orx-country-card__tag').length,mapNodes:document.querySelectorAll('.orx-market-map__node').length};"""
          for lang,path,dirn in pages:
            for w,h in views:
              sid=session(w,h)
              try:
                req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.45);m=js(sid,metric,[w]);required=44 if w<=1024 else 40
                checks={'direction':m['dir']==dirn,'noOverflow':not m['overflow'] and m['off']==0,'touchTargets':m['minButton']>=required,'h1':m['h1'],'sixSections':m['sections']==6,'sixCards':m['cards']==6 and m['visibleCards']==6,'channelTags':m['tags']>=18,'sixMapNodes':m['mapNodes']==6}
                if not all(checks.values()): errors.append(f'{lang}-{w}: {checks} {m}')
                results.append({'lang':lang,'viewport':w,'checks':checks,'metrics':m,'pass':all(checks.values())})
              finally:
                try:req('DELETE',f'/session/{sid}')
                except:pass

            sid=session(1366,900)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.4)
              inter=js(sid,"""const q=document.querySelector('[data-orx-country-filter=\"qatar\"]');if(!q)return false;q.click();const cards=[...document.querySelectorAll('[data-orx-market-card]')];const shown=cards.filter(x=>!x.hidden);const count=document.querySelector('[data-orx-market-count]')?.textContent.trim();const active=q.getAttribute('aria-pressed')==='true';const all=document.querySelector('[data-orx-country-filter=\"all\"]');const one=shown.length===1&&shown[0].dataset.country==='qatar'&&count==='1'&&active;all.click();const six=cards.filter(x=>!x.hidden).length===6&&document.querySelector('[data-orx-market-count]')?.textContent.trim()==='6';const t=document.querySelector('[data-orx-mega-trigger]');t?.click();const m=t?document.getElementById(t.getAttribute('aria-controls')):null;const current=m?.querySelector('a[data-orx-market-link=\"markets.html\"][aria-current=\"page\"]');const access=m?.querySelector('a[data-orx-market-link=\"market-access.html\"]');document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return !!one&&!!six&&!!current&&!!access&&t?.getAttribute('aria-expanded')==='false'&&m?.hidden;""")
              if not inter: errors.append(f'{lang}: desktop filter/Market navigation')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass

            sid=session(390,844)
            try:
              req('POST',f'/session/{sid}/url',{'url':'http://127.0.0.1:4173'+path});time.sleep(.4)
              mobile=js(sid,"""const b=document.querySelector('[data-orx-drawer-open]');if(!b)return false;b.click();const d=document.querySelector('[data-orx-mobile-drawer]');const current=d.querySelector('a[data-orx-market-link=\"markets.html\"][aria-current=\"page\"]');const access=d.querySelector('a[data-orx-market-link=\"market-access.html\"]');const lang=d.querySelector('a[lang]');const ok=d.getAttribute('aria-hidden')==='false'&&current&&access&&lang;document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));return !!ok&&d.getAttribute('aria-hidden')==='true';""")
              if not mobile: errors.append(f'{lang}: mobile Market navigation/language')
            finally:
              try:req('DELETE',f'/session/{sid}')
              except:pass

          report={'generatedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'failures':len(errors),'results':results,'errors':errors};(OUT/'rendered-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8');(OUT/'run-status.txt').write_text('PASS\n' if not errors else 'FAIL\n')
          if errors: print('\n'.join(errors));sys.exit(1)
          PY

      - name: Record QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add qa/pg15-markets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG15 record Markets Countries QA evidence'
          git pull --rebase origin main
          git push origin HEAD:main
