name: PG09 Align Tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg09-align-tracker.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align implementation tracker for M4 PG09
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMPLEMENTATION-STATUS-V1.md')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('Last Updated: 2026-08-19 — M2 HOME FAMILY IMPLEMENTED / M3 CODE+CI COMPLETE / PG05–PG08 + PG14–PG15 C7 CI QA PASS','Last Updated: 2026-08-19 — M4 IN PROGRESS / PG09 C7 CI QA PASS / M3 CODE+CI COMPLETE'),
            ('| PG15 Markets / Countries | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + MARKET-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |','| PG15 Markets / Countries | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + MARKET-NAVIGATION QA PASS |\n| PG09 Product Categories | C7 IMPLEMENTED — AR+EN — SOURCE + RENDERED + FILTER + PRODUCT-NAVIGATION QA PASS |\n| M3 Shared Navigation IA |'),
            ('| Current Build Baseline | M3 CODE / CI COMPLETE — PG05–PG08 + PG14–PG15; Cloudflare batch review pending |','| Current Build Baseline | M4 IN PROGRESS — PG09 C7 CI PASS; PG10 next. M2/M3 Cloudflare closure remains open in parallel |'),
            ('| M4 Product / Supplier / Conversion | NOT STARTED | Data/forms/conversion QA |','| M4 Product / Supplier / Conversion | IN PROGRESS | PG09 C7 CI PASS; PG10–PG13 + PG16–PG19 remain |'),
            ('└── markets.html                   # PG15 — C7 CI PASS','├── markets.html                   # PG15 — C7 CI PASS\n└── product-categories.html        # PG09 — C7 CI PASS'),
            ('└── markets.html                   # PG15 — C7 CI PASS','├── markets.html                   # PG15 — C7 CI PASS\n└── product-categories.html        # PG09 — C7 CI PASS'),
            ('│   ├── origex-markets.css\n│   └── origex-shell.css','│   ├── origex-markets.css\n│   ├── origex-product-categories.css\n│   └── origex-shell.css'),
            ('│   ├── origex-markets.js\n│   └── origex-landing.js','│   ├── origex-markets.js\n│   ├── origex-product-categories.js\n│   └── origex-landing.js'),
            ('├── pg14-market-access/\n└── pg15-markets/','├── pg14-market-access/\n├── pg15-markets/\n└── pg09-product-categories/'),
            ('│   ├── pg14-market-access-v1.md\n│   └── pg15-markets-v1.md','│   ├── pg14-market-access-v1.md\n│   ├── pg15-markets-v1.md\n│   └── pg09-product-categories-v1.md'),
            ('| PG09 | Product Categories | C0 | NOT STARTED | NOT STARTED | NOT STARTED |','| PG09 | Product Categories | C7 — IMPLEMENTED | APPROVED — `pg09-product-categories-v1.md` | `ar/product-categories.html` + `en/product-categories.html` | SOURCE + RENDERED + FILTER + PRODUCT-NAVIGATION QA PASS — CLOUDFLARE M4 BATCH REVIEW PENDING |')
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('missing tracker text: '+old[:100])
            s=s.replace(old,new,1)
          marker='## Cloudflare Test Environment Control'
          section='''## M4 Evidence\n\n### PG09 — Product Categories\n- Frozen scope: hero, category facts, category filters, six category cards and CTA.\n- Profile: `docs/page-design-profiles/pg09-product-categories-v1.md`.\n- Arabic: `ar/product-categories.html`.\n- English: `en/product-categories.html`.\n- Composition: `assets/css/origex-product-categories.css`.\n- Filter adapter: `assets/js/origex-product-categories.js`.\n- Shared Product IA: `assets/js/origex-ui.js` exposes Product Categories + All Products centrally and treats Product Details as a child of Products.\n- Source QA: `qa/pg09-product-categories/source-report.json` — failures 0.\n- Rendered QA: `qa/pg09-product-categories/rendered-report.json` — AR/EN × 390/820/1366/1536 = 8/8 PASS; no overflow; direction and touch targets PASS.\n- Category filter/reset and desktop/mobile Product navigation PASS.\n- Final QA: `qa/pg09-product-categories/run-status.txt` — PASS.\n- Current: C7 pending Cloudflare M4 batch browser review. PG10 is next.\n\n'''
          if '### PG09 — Product Categories' not in s:
            s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION-STATUS-V1.md
          git commit -m 'M4 align tracker after PG09 CI QA pass'
          git pull --rebase origin main
          git push origin HEAD:main
