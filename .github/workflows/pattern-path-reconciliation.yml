name: Pattern Path Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/normalize_pattern_asset_paths.py'
      - '.github/workflows/pattern-path-reconciliation.yml'

concurrency:
  group: pattern-path-reconciliation
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install regression dependencies
        run: python -m pip install --quiet beautifulsoup4 selenium
      - name: Normalize shipped pattern paths
        run: python .github/scripts/normalize_pattern_asset_paths.py
      - id: regression
        name: Run all-page AR EN regression
        continue-on-error: true
        run: python .github/scripts/qa_global_ar_en_regression.py
      - name: Commit normalized pages and evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar en qa/global-ar-en-regression || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize pattern paths and record global regression"
          git pull --rebase origin main || true
          git push origin main || true
      - name: Enforce regression result
        if: steps.regression.outcome == 'failure'
        run: exit 1
