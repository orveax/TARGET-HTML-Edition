name: PG06 Fix Icon References

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg06-fix-icon-refs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace unresolved PG06 sprite references
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/sprite\.svg#store/sprite.svg#boxes/g; s/sprite\.svg#files/sprite.svg#file-text/g' ar/how-we-work.html en/how-we-work.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar/how-we-work.html en/how-we-work.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PG06 resolve icon references'
          git pull --rebase origin main
          git push origin HEAD:main
