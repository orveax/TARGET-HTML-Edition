name: PG09 Product Navigation Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pg09-product-nav-alignment.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add reusable Product navigation hydration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/origex-ui.js')
          s=p.read_text(encoding='utf-8')
          marker='  hydrateHomeFamilyNavigation();\n  // Keep this separator so the retired one-time PG14 workflow cannot reapply the patch.\n  hydrateCompanyNavigation();\n  hydrateMarketNavigation();'
          if marker not in s:
              raise SystemExit('expected hydration marker not found')
          if 'const hydrateProductNavigation = () =>' in s:
              raise SystemExit('Product navigation already exists')
          block=r'''  // M4 product IA: expose Product Categories and Products centrally.
  // Product Details is treated as a child of Products for current-state semantics.
  const hydrateProductNavigation = () => {
    const isArabic = document.documentElement.lang.toLowerCase().startsWith('ar');
    const currentFile = window.location.pathname.split('/').pop() || 'index.html';
    const activeProductFile = currentFile === 'product-details.html' ? 'products.html' : currentFile;
    const productFiles = new Set(['product-categories.html', 'products.html']);
    const labels = isArabic
      ? {
          items: [
            ['product-categories.html', 'فئات المنتجات'],
            ['products.html', 'كل المنتجات']
          ]
        }
      : {
          items: [
            ['product-categories.html', 'Product Categories'],
            ['products.html', 'All Products']
          ]
        };

    qsa('[data-orx-mega-menu]').forEach((menu) => {
      labels.items.forEach(([href, text]) => {
        const link = menu.querySelector(`a[href="${href}"]`);
        if (!link) return;
        link.textContent = text;
        link.dataset.orxProductLink = href;
        link.removeAttribute('aria-current');
        if (href === activeProductFile) link.setAttribute('aria-current', 'page');
      });
    });

    qsa('.orx-mobile-nav').forEach((nav) => {
      qsa('a', nav).forEach((link) => {
        const href = (link.getAttribute('href') || '').split('#')[0];
        if (productFiles.has(href)) link.remove();
      });

      const fragment = document.createDocumentFragment();
      labels.items.forEach(([href, text]) => {
        const link = document.createElement('a');
        link.href = href;
        link.textContent = text;
        link.dataset.orxProductLink = href;
        if (href === activeProductFile) link.setAttribute('aria-current', 'page');
        fragment.append(link);
      });

      const lastHome = nav.querySelector('[data-orx-home-variant-link]:last-of-type');
      if (lastHome) lastHome.after(fragment);
      else nav.prepend(fragment);
    });
  };

'''
          newcalls='  hydrateHomeFamilyNavigation();\n  hydrateProductNavigation();\n  // Keep this separator so the retired one-time PG14 workflow cannot reapply the patch.\n  hydrateCompanyNavigation();\n  hydrateMarketNavigation();'
          s=s.replace(marker, block+newcalls, 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add assets/js/origex-ui.js
          git rm .github/workflows/pg09-product-nav-alignment.yml
          git commit -m 'PG09 add shared Product navigation IA'
          git pull --rebase origin main
          git push origin HEAD:main
