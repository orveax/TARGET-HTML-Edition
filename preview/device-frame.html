<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ORIGEX — Responsive Preview Frame</title>
  <link rel="stylesheet" href="_frame/preview-frame.css">
</head>
<body>
  <main class="pf-shell">
    <header class="pf-bar">
      <div class="pf-brand">
        <strong>ORIGEX Preview</strong>
        <span>ORX-P01 · ORVEAX · review only</span>
      </div>
      <div class="pf-controls" aria-label="Preview controls">
        <button class="pf-btn" type="button" data-pf-lang="ar" aria-pressed="true">العربية</button>
        <button class="pf-btn" type="button" data-pf-lang="en" aria-pressed="false">English</button>
        <button class="pf-btn" type="button" data-pf-mode="grid" aria-pressed="true">Grid</button>
        <button class="pf-btn" type="button" data-pf-mode="focus" aria-pressed="false">Focus</button>
        <select class="pf-select" data-pf-screen aria-label="Screen size"></select>
        <a class="pf-link" data-pf-raw href="brand-board-v2.html?lang=ar" target="_blank" rel="noopener">Raw Preview ↗</a>
      </div>
    </header>
    <section class="pf-stage" data-pf-stage aria-live="polite"></section>
  </main>
  <script src="_frame/preview-frame.js"></script>
</body>
</html>
