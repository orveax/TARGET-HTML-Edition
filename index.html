<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0; url=./ar/">
  <title>ORIGEX — Staging</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0d252b;background:#faf8f4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);padding:32px;border:1px solid #ddd6cc;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(13,37,43,.08)}
    h1{margin:0 0 10px;font-size:clamp(28px,6vw,42px)}
    p{margin:0 0 22px;color:#5f6768;line-height:1.7}
    nav{display:flex;flex-wrap:wrap;gap:10px}
    a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid #0d252b;color:#0d252b}
    a:first-child{background:#0d252b;color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>ORIGEX</h1>
    <p>جارٍ فتح النسخة العربية. يمكنك اختيار النسخة يدويًا إذا لم يتم التحويل تلقائيًا.</p>
    <nav aria-label="اختيار اللغة">
      <a href="./ar/" lang="ar" hreflang="ar">العربية</a>
      <a href="./en/" lang="en" hreflang="en">English</a>
    </nav>
  </main>
  <script>
    window.location.replace(new URL('./ar/', window.location.href).href);
  </script>
</body>
</html>
